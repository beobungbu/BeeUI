appId: com.beeui.showcase
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element:
      id: "showcase-open-runtime"
    direction: DOWN
- waitForAnimationToEnd
- tapOn:
    id: "showcase-open-runtime"
- assertVisible:
    id: "runtime-ready"
- assertVisible:
    id: "runtime-safe-area-nonzero"

# I2 — regular Dialog + DropdownMenu child remains above the Dialog and
# selecting the child does not dismiss the parent Dialog.
- scrollUntilVisible:
    element:
      id: "runtime-dialog-menu-trigger"
    direction: DOWN
- waitForAnimationToEnd
- tapOn:
    id: "runtime-dialog-menu-trigger"
- assertVisible:
    id: "runtime-dialog-menu-content"
- tapOn:
    id: "runtime-dialog-child-menu-trigger"
- assertVisible:
    id: "runtime-dialog-child-menu-content"
- tapOn:
    id: "runtime-dialog-child-menu-item"
- assertNotVisible:
    id: "runtime-dialog-child-menu-content"
- assertVisible:
    id: "runtime-dialog-menu-content"
- tapOn:
    id: "runtime-dialog-menu-close"
- assertNotVisible:
    id: "runtime-dialog-menu-content"

- scrollUntilVisible:
    element:
      id: "runtime-over-full-screen-trigger"
    direction: DOWN
- waitForAnimationToEnd
- tapOn:
    id: "runtime-over-full-screen-trigger"
- assertVisible:
    id: "runtime-over-full-screen-content"
- tapOn:
    id: "runtime-over-full-screen-popover-trigger"
- assertVisible:
    id: "runtime-over-full-screen-popover-content"
- takeScreenshot: ".artifacts/runtime-smoke/ios/over-full-screen-popover"
- tapOn:
    id: "runtime-over-full-screen-popover-close"
- tapOn:
    id: "runtime-over-full-screen-close"
# Wait for the dialog's native presentation to actually finish dismissing -
# not just the JS state flip - before proceeding, as a real user would;
# tapping mid-dismiss lands on the closing view and is swallowed.
- waitForAnimationToEnd
- assertNotVisible:
    id: "runtime-over-full-screen-content"
- assertVisible:
    text: "overFullScreen state: closed"

- scrollUntilVisible:
    element:
      id: "runtime-page-sheet-trigger"
    direction: DOWN
- waitForAnimationToEnd
# A real user who taps right as the previous sheet is still settling and
# sees nothing happen simply taps again; mirror that instead of masking a
# residual swallowed-tap race with a blind sleep.
- tapOn:
    id: "runtime-page-sheet-trigger"
    retryTapIfNoChange: true
- assertVisible:
    id: "runtime-page-sheet-content"
- assertVisible:
    text: "pageSheet"
- tapOn:
    id: "runtime-page-sheet-popover-trigger"
- assertVisible:
    id: "runtime-page-sheet-popover-content"
- takeScreenshot: ".artifacts/runtime-smoke/ios/page-sheet-popover"
- tapOn:
    id: "runtime-page-sheet-popover-close"
- tapOn:
    id: "runtime-page-sheet-menu-trigger"
- assertVisible:
    id: "runtime-page-sheet-menu-content"
- tapOn:
    id: "runtime-page-sheet-menu-item"
- assertVisible:
    text: "menu selection: selected"
- tapOn:
    id: "runtime-page-sheet-input"
- inputText: "page-sheet-keyboard"
- assertVisible:
    text: "page-sheet-keyboard"
- takeScreenshot: ".artifacts/runtime-smoke/ios/page-sheet-keyboard"
- hideKeyboard
- swipe:
    start: "50%, 14%"
    end: "50%, 94%"
    duration: 700
- assertNotVisible:
    id: "runtime-page-sheet-content"
- assertVisible:
    text: "pageSheet state: closed"
- assertVisible:
    text: "pageSheet requestClose: 1"

# Same settle after the swipe-dismiss before opening the next sheet; the
# preceding assertNotVisible on runtime-page-sheet-content above already
# waited for the real native dismiss, so mirror the same resilient tap.
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "runtime-form-sheet-trigger"
    direction: DOWN
- waitForAnimationToEnd
- tapOn:
    id: "runtime-form-sheet-trigger"
    retryTapIfNoChange: true
- assertVisible:
    id: "runtime-form-sheet-content"
- tapOn:
    id: "runtime-form-sheet-popover-trigger"
- assertVisible:
    id: "runtime-form-sheet-popover-content"
- takeScreenshot: ".artifacts/runtime-smoke/ios/form-sheet-popover"
- tapOn:
    id: "runtime-form-sheet-popover-close"
- tapOn:
    id: "runtime-form-sheet-menu-trigger"
- assertVisible:
    id: "runtime-form-sheet-menu-content"
- tapOn:
    id: "runtime-form-sheet-menu-item"
- assertVisible:
    text: "menu selection: selected"
- swipe:
    start: "50%, 14%"
    end: "50%, 94%"
    duration: 700
- assertNotVisible:
    id: "runtime-form-sheet-content"
- assertVisible:
    text: "formSheet state: closed"
- assertVisible:
    text: "formSheet requestClose: 1"
