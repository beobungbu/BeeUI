appId: com.beeui.showcase
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    timeout: 180000
    visible:
      id: "showcase-home"

# The home catalog is responsive and scrollable. On tall-text/large-font Android
# configurations the Components card can start just below the initial viewport,
# so discover it the same way as every lower launcher before tapping it.
- scrollUntilVisible:
    element:
      id: "showcase-open-components"
    direction: DOWN
    visibilityPercentage: 100
- waitForAnimationToEnd
# Maestro can report an iOS tap as delivered while a freshly scrolled React
# Native control is still settling its hit target. Treat the destination, not
# the tap command, as proof that navigation happened and retry the pair.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "showcase-open-components"
      - extendedWaitUntil:
          visible:
            id: "component-gallery"
          timeout: 12000
- waitForAnimationToEnd
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "component-gallery-back"
      - assertVisible:
          id: "showcase-home"

# Home is intentionally scrollable at large Dynamic Type scales. Never assume
# lower catalog launchers remain inside the viewport after returning home.
- scrollUntilVisible:
    element:
      id: "showcase-open-patterns"
    direction: DOWN
- waitForAnimationToEnd
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "showcase-open-patterns"
      - extendedWaitUntil:
          visible:
            id: "pattern-gallery"
          timeout: 12000
- waitForAnimationToEnd
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "pattern-gallery-back"
      - assertVisible:
          id: "showcase-home"

- scrollUntilVisible:
    element:
      id: "showcase-open-runtime"
    direction: DOWN
- waitForAnimationToEnd
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "showcase-open-runtime"
      - extendedWaitUntil:
          visible:
            id: "runtime-ready"
          timeout: 12000

- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "runtime-theme-light"
      - assertVisible:
          text: "theme: light"
- waitForAnimationToEnd
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "runtime-theme-dark"
      - assertVisible:
          text: "theme: dark"
- waitForAnimationToEnd
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "runtime-theme-light"
      - assertVisible:
          text: "theme: light"

- tapOn:
    id: "runtime-dialog-trigger"
- assertVisible:
    id: "runtime-dialog-content"
- waitForAnimationToEnd
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "runtime-dialog-close"
      - assertNotVisible:
          id: "runtime-dialog-content"

# #619 — SheetProvider must preserve BeeUI runtime context and z-order through
# gorhom's detached modal portal on both native platforms. The hook creating the
# Toast executes inside Sheet content; the Popover must target the Sheet-local
# overlay host rather than render below the modal.
- scrollUntilVisible:
    element:
      id: "runtime-sheet-trigger"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- waitForAnimationToEnd
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "runtime-sheet-trigger"
      - extendedWaitUntil:
          visible:
            id: "runtime-sheet-content"
          timeout: 15000
- tapOn:
    id: "runtime-sheet-toast-show"
- extendedWaitUntil:
    visible:
      text: "Sheet-local runtime toast"
    timeout: 10000
- assertVisible:
    id: "runtime-sheet-content"
- tapOn:
    id: "runtime-sheet-toast-dismiss"
- extendedWaitUntil:
    notVisible:
      text: "Sheet-local runtime toast"
    timeout: 10000
- tapOn:
    id: "runtime-sheet-popover-trigger"
- extendedWaitUntil:
    visible:
      id: "runtime-sheet-popover-content"
    timeout: 15000
- assertVisible:
    text: "Anchored content remains above the native Sheet."
- assertVisible:
    id: "runtime-sheet-content"
- tapOn:
    id: "runtime-sheet-popover-close"
- assertNotVisible:
    id: "runtime-sheet-popover-content"
- assertVisible:
    id: "runtime-sheet-content"
- tapOn:
    id: "runtime-sheet-select-trigger"
- extendedWaitUntil:
    visible:
      id: "runtime-sheet-select-content"
    timeout: 15000
- tapOn:
    id: "runtime-sheet-select-item-alpha"
- assertNotVisible:
    id: "runtime-sheet-select-content"
- assertVisible:
    text: "sheet select: alpha"
- assertVisible:
    id: "runtime-sheet-content"
- tapOn:
    id: "runtime-sheet-close"
- extendedWaitUntil:
    notVisible:
      id: "runtime-sheet-content"
    timeout: 10000

# The AlertDialog trigger sits below Dialog/Sheet inside the same tall card. On
# iOS Maestro can resolve and "tap" its accessibility node while the native hit
# target is still below the viewport, producing a delivered tap with no dialog.
# Center the real trigger and prove the destination inside the same retry.
- scrollUntilVisible:
    element:
      id: "runtime-alert-trigger"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- waitForAnimationToEnd
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "runtime-alert-trigger"
      - extendedWaitUntil:
          visible:
            id: "runtime-alert-content"
          timeout: 15000
- waitForAnimationToEnd
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "runtime-alert-cancel"
      - assertNotVisible:
          id: "runtime-alert-content"

# Popover is anchored to its trigger. On iOS a direct Maestro tap can resolve a
# below-fold accessibility node without scrolling the React Native anchor into
# a stable viewport position; the tap reports success but the overlay never
# opens. Center the trigger first and use the rendered content as tap proof.
- scrollUntilVisible:
    element:
      id: "runtime-popover-trigger"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- waitForAnimationToEnd
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "runtime-popover-trigger"
      - extendedWaitUntil:
          visible:
            id: "runtime-popover-content"
          timeout: 15000
- assertVisible:
    id: "runtime-popover-content"
- assertVisible:
    text: "Root Popover content is visible."
- waitForAnimationToEnd
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "runtime-popover-close"
      - assertNotVisible:
          id: "runtime-popover-content"

# Keep the baseline Menu check independent of transient development chrome at
# the bottom edge (for example LogBox warnings on Android CI). Edge/collision
# pressure is covered by the dedicated #126 runtime-stress fixture instead.
# Centering also gives the anchored content time and space to complete its
# asynchronous measure -> position -> accessibility-visible transition.
- scrollUntilVisible:
    element:
      id: "runtime-menu-trigger"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "runtime-menu-trigger"
- extendedWaitUntil:
    timeout: 15000
    visible:
      id: "runtime-menu-content"
- assertVisible:
    id: "runtime-menu-content"
- waitForAnimationToEnd
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "runtime-menu-item"
      - assertNotVisible:
          id: "runtime-menu-content"
      - assertVisible:
          text: "selection: alpha"

# Scrolling to exactly 100% visibility with no centering can leave the Show
# button sitting right at the viewport edge (proven by CI failure captures),
# where a tap is delivered but lands on/past the boundary of the real hit
# target. Center it the same way every other trigger in this flow does, and
# retry the tap/assert pair like the other overlay triggers below.
- scrollUntilVisible:
    element:
      id: "runtime-toast-show"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- waitForAnimationToEnd
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "runtime-toast-show"
      - extendedWaitUntil:
          visible:
            text: "Runtime toast"
          timeout: 10000
# The persistent-toast dismiss fixture is the next row in the scroll content,
# not the close affordance rendered inside the Toast overlay. Bringing only the
# Show button into view can leave this control below Android's viewport even
# though the Toast itself is visible. Center the actual test control before
# asserting/tapping it, while proving the persistent Toast survives the scroll.
- scrollUntilVisible:
    element:
      id: "runtime-toast-dismiss"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- waitForAnimationToEnd
- assertVisible:
    text: "Runtime toast"
- retry:
    maxRetries: 4
    commands:
      - extendedWaitUntil:
          visible:
            id: "runtime-toast-dismiss"
          timeout: 15000
      - tapOn:
          id: "runtime-toast-dismiss"
      - assertNotVisible:
          text: "Runtime toast"

- scrollUntilVisible:
    element:
      id: "runtime-input"
    direction: DOWN
- waitForAnimationToEnd
- tapOn:
    id: "runtime-input"
- inputText: "runtime-keyboard"
- assertVisible:
    text: "runtime-keyboard"
# Maestro's hideKeyboard helper is unreliable on iOS Simulator. Dismiss using
# an explicit non-interactive label adjacent to the focused input instead.
- tapOn:
    text: "Runtime input"

- scrollUntilVisible:
    element:
      id: "runtime-scroll-end"
    direction: DOWN
- waitForAnimationToEnd
- assertVisible:
    id: "runtime-scroll-end"
