name: expo-consumer

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'apps/showcase/**'
      - 'scripts/verify-expo-consumer.sh'
      - 'scripts/classify-ci-changes.mjs'
      - 'scripts/ci-scope.mjs'
      - '.github/workflows/expo-consumer.yml'
  push:
    # #474 rule 12: integration checkpoints land as merge commits on development and
    # promotion candidates on staging, so the external-consumer proof must re-run on the
    # exact integrated head rather than inherit a sibling PR head's green.
    branches:
      - development
      - staging
      - main
  schedule:
    - cron: '5 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24.13.1
  PNPM_VERSION: 10.15.0
  XCODE_MIN_VERSION: '26.4'

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      full-ci: ${{ steps.mode.outputs.full-ci }}
      consumer-required: ${{ steps.scope.outputs.expo-consumer }}
      native-required: ${{ steps.native.outputs.showcase-native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Resolve changed paths and CI mode
        id: mode
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FORCE_FULL: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'development' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          FORCE_NATIVE: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'development' || contains(github.event.pull_request.labels.*.name, 'ci:native') }}
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/changed.txt"
          if [ "${{ github.event_name }}" = pull_request ]; then
            git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" > "$changed"
          else
            : > "$changed"
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "full-ci=$FORCE_FULL" >> "$GITHUB_OUTPUT"
          echo "force-native=$FORCE_NATIVE" >> "$GITHUB_OUTPUT"
      - name: Classify Expo consumer scope
        id: scope
        env:
          BEEUI_FORCE_FULL_CI: ${{ steps.mode.outputs.full-ci }}
        run: node ./scripts/ci-scope.mjs < "${{ steps.mode.outputs.changed }}"
      - name: Classify native graph
        id: native
        env:
          BEEUI_FORCE_NATIVE: ${{ steps.mode.outputs.force-native }}
        run: node ./scripts/classify-ci-changes.mjs < "${{ steps.mode.outputs.changed }}"

  # Typecheck and all three Metro exports now share one install and one isolated
  # consumer. The old workflow spent three runner slots before native work began.
  expo-consumer:
    needs: [scope]
    if: needs.scope.outputs.full-ci == 'true' || needs.scope.outputs.consumer-required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm config set store-dir "$HOME/.pnpm-store"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Cache Metro/Expo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.expo
            node_modules/.cache
          key: expo-consumer-metro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: expo-consumer-metro-${{ runner.os }}-
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Prepare independent Expo consumer
        env:
          BEEUI_EXPO_CONSUMER_WORK_ROOT: ${{ runner.temp }}/beeui-expo-consumer
          BEEUI_EXPO_CONSUMER_CLEAN: '1'
        run: bash scripts/verify-expo-consumer.sh prepare
      - name: Typecheck independent Expo consumer
        env:
          BEEUI_EXPO_CONSUMER_WORK_ROOT: ${{ runner.temp }}/beeui-expo-consumer
        run: bash scripts/verify-expo-consumer.sh typecheck
      - name: Export independent Expo consumer for Web, Android and iOS
        env:
          BEEUI_EXPO_CONSUMER_WORK_ROOT: ${{ runner.temp }}/beeui-expo-consumer
        run: bash scripts/verify-expo-consumer.sh bundle
      - name: Upload consumer exports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: expo-consumer-exports-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/beeui-expo-consumer/app/dist-web
            ${{ runner.temp }}/beeui-expo-consumer/app/dist-android
            ${{ runner.temp }}/beeui-expo-consumer/app/dist-ios
          if-no-files-found: error
          retention-days: 3

  android-native:
    needs: [scope]
    if: needs.scope.outputs.native-required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'schedule' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          add-job-summary: always
      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.0
      - name: Install Android build dependencies
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"
      - name: Enable pinned pnpm
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm config set store-dir "$HOME/.pnpm-store"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Prepare independent Expo consumer
        env:
          BEEUI_EXPO_CONSUMER_WORK_ROOT: ${{ runner.temp }}/beeui-expo-consumer
          BEEUI_EXPO_CONSUMER_CLEAN: '1'
        run: bash scripts/verify-expo-consumer.sh prepare
      - name: Compile Expo consumer Android debug APK
        env:
          BEEUI_EXPO_CONSUMER_WORK_ROOT: ${{ runner.temp }}/beeui-expo-consumer
        run: bash scripts/verify-expo-consumer.sh android-build

  ios-native:
    needs: [scope]
    if: needs.scope.outputs.native-required == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      BEEUI_XCODE_COMPILATION_CACHE: ${{ github.event_name == 'schedule' && 'NO' || 'YES' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - name: Select Xcode ${{ env.XCODE_MIN_VERSION }}+
        id: select-xcode
        run: |
          set -euo pipefail
          selected=''
          version=''
          version_is_supported() {
            local current="$1" minimum="$2" major minor min_major min_minor
            IFS='.' read -r major minor _ <<< "$current"
            IFS='.' read -r min_major min_minor _ <<< "$minimum"
            (( ${major:-0} > ${min_major:-0} || (${major:-0} == ${min_major:-0} && ${minor:-0} >= ${min_minor:-0}) ))
          }
          for app in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -rV); do
            candidate="$app/Contents/Developer"
            [ -d "$candidate" ] || continue
            current="$(DEVELOPER_DIR="$candidate" xcodebuild -version | awk 'NR == 1 { print $2 }')"
            if version_is_supported "$current" "$XCODE_MIN_VERSION"; then
              selected="$candidate"
              version="$current"
              break
            fi
          done
          test -n "$selected"
          cache_root="$HOME/Library/Caches/BeeUI"
          mkdir -p "$cache_root"
          echo "DEVELOPER_DIR=$selected" >> "$GITHUB_ENV"
          echo "BEEUI_XCODE_VERSION=$version" >> "$GITHUB_ENV"
          echo "BEEUI_IOS_CACHE_ROOT=$cache_root" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          DEVELOPER_DIR="$selected" xcodebuild -version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm config set store-dir "$HOME/.pnpm-store"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: pods-expo-consumer-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pods-expo-consumer-
      - name: Cache Xcode compilation results
        if: github.event_name != 'schedule'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/Library/Caches/BeeUI/DerivedData/expo-consumer/**/CompilationCache.noindex
          key: xcode-expo-cas-v1-${{ runner.arch }}-${{ steps.select-xcode.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            xcode-expo-cas-v1-${{ runner.arch }}-${{ steps.select-xcode.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}-
            xcode-expo-cas-v1-${{ runner.arch }}-${{ steps.select-xcode.outputs.version }}-
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --store-dir "$HOME/.pnpm-store/beeui-v10"
      - name: Prepare independent Expo consumer
        env:
          BEEUI_EXPO_CONSUMER_WORK_ROOT: ${{ runner.temp }}/beeui-expo-consumer
          BEEUI_EXPO_CONSUMER_CLEAN: '1'
        run: bash scripts/verify-expo-consumer.sh prepare
      - name: Compile Expo consumer for iOS Simulator
        env:
          BEEUI_EXPO_CONSUMER_WORK_ROOT: ${{ runner.temp }}/beeui-expo-consumer
        run: bash scripts/verify-expo-consumer.sh ios-build 2>&1 | tee "$RUNNER_TEMP/beeui-expo-ios.log"
      - name: Upload iOS xcodebuild log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: expo-consumer-ios-xcodebuild-${{ github.run_id }}
          path: ${{ runner.temp }}/beeui-expo-ios.log
          if-no-files-found: warn
          retention-days: 2
