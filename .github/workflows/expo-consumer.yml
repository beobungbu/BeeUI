name: expo-consumer

# Independent packed Expo SDK 57 consumer. The initial PR fan-out is
# deliberately three jobs: combined with BeeUI's required/core workflows this
# fills the 20-job GitHub Free concurrency budget without making required jobs
# compete randomly with extra Expo work. Native compile starts as soon as the
# bootstrap lane frees a slot.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main
  schedule:
    - cron: '5 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24.13.1
  PNPM_VERSION: 10.15.0

jobs:
  typecheck-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: pnpm store dir
        run: pnpm config set store-dir "$HOME/.pnpm-store"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare independent Expo consumer
        env:
          BEEUI_EXPO_CONSUMER_WORK_ROOT: ${{ runner.temp }}/beeui-expo-consumer
          BEEUI_EXPO_CONSUMER_CLEAN: '1'
        run: bash scripts/verify-expo-consumer.sh prepare

      - name: Typecheck independent Expo consumer
        env:
          BEEUI_EXPO_CONSUMER_WORK_ROOT: ${{ runner.temp }}/beeui-expo-consumer
        run: bash scripts/verify-expo-consumer.sh typecheck

      - name: Export independent Expo consumer for Web
        working-directory: ${{ runner.temp }}/beeui-expo-consumer/app
        run: npx expo export --platform web --output-dir dist-web

      - name: Upload Web consumer export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: expo-consumer-web-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/beeui-expo-consumer/app/dist-web
          if-no-files-found: error
          retention-days: 3

  platform-export:
    name: expo-consumer-${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: pnpm store dir
        run: pnpm config set store-dir "$HOME/.pnpm-store"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare independent Expo consumer
        env:
          BEEUI_EXPO_CONSUMER_WORK_ROOT: ${{ runner.temp }}/beeui-expo-consumer
          BEEUI_EXPO_CONSUMER_CLEAN: '1'
        run: bash scripts/verify-expo-consumer.sh prepare

      - name: Export independent Expo consumer for ${{ matrix.platform }}
        working-directory: ${{ runner.temp }}/beeui-expo-consumer/app
        run: >
          npx expo export
          --platform "${{ matrix.platform }}"
          --output-dir "dist-${{ matrix.platform }}"

      - name: Upload consumer export output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: expo-consumer-${{ matrix.platform }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/beeui-expo-consumer/app/dist-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 3

  android-native:
    needs: [typecheck-web]
    if: >
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:native'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: pnpm store dir
        run: pnpm config set store-dir "$HOME/.pnpm-store"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-expo-${{ runner.os }}-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: gradle-expo-${{ runner.os }}-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.0

      - name: Install Android build dependencies
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Prepare independent Expo consumer
        env:
          BEEUI_EXPO_CONSUMER_WORK_ROOT: ${{ runner.temp }}/beeui-expo-consumer
          BEEUI_EXPO_CONSUMER_CLEAN: '1'
        run: bash scripts/verify-expo-consumer.sh prepare

      - name: Compile Expo consumer Android debug APK
        env:
          BEEUI_EXPO_CONSUMER_WORK_ROOT: ${{ runner.temp }}/beeui-expo-consumer
        run: bash scripts/verify-expo-consumer.sh android-build

  ios-native:
    needs: [typecheck-web]
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      XCODE_MIN_VERSION: "26.4"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      - name: Select Xcode ${{ env.XCODE_MIN_VERSION }}+
        run: |
          set -euo pipefail
          selected_developer_dir=""
          selected_version=""
          version_is_supported() {
            local version="$1" min_version="$2"
            local major minor min_major min_minor
            IFS='.' read -r major minor _ <<< "$version"
            IFS='.' read -r min_major min_minor _ <<< "$min_version"
            if (( ${major:-0} > ${min_major:-0} || (${major:-0} == ${min_major:-0} && ${minor:-0} >= ${min_minor:-0}) )); then
              return 0
            fi
            return 1
          }
          for app in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -rV); do
            [ -d "$app/Contents/Developer" ] || continue
            candidate="$app/Contents/Developer"
            version="$(DEVELOPER_DIR="$candidate" /usr/bin/xcodebuild -version | awk 'NR == 1 { print $2 }')"
            if version_is_supported "$version" "$XCODE_MIN_VERSION"; then
              selected_developer_dir="$candidate"
              selected_version="$version"
              break
            fi
          done
          test -n "$selected_developer_dir"
          echo "DEVELOPER_DIR=$selected_developer_dir" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$selected_developer_dir"
          /usr/bin/xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: pnpm store dir
        run: pnpm config set store-dir "$HOME/.pnpm-store"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: pods-expo-consumer-macos-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pods-expo-consumer-macos-

      - name: Install darwin-arm64 workspace dependencies
        run: >
          pnpm install --frozen-lockfile --prefer-offline
          --store-dir "$HOME/.pnpm-store/beeui-v10"

      - name: Prepare independent Expo consumer
        env:
          BEEUI_EXPO_CONSUMER_WORK_ROOT: ${{ runner.temp }}/beeui-expo-consumer
          BEEUI_EXPO_CONSUMER_CLEAN: '1'
        run: bash scripts/verify-expo-consumer.sh prepare

      - name: Compile Expo consumer for iOS Simulator
        env:
          BEEUI_EXPO_CONSUMER_WORK_ROOT: ${{ runner.temp }}/beeui-expo-consumer
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/beeui-expo-consumer-ios-xcodebuild.log"
          bash scripts/verify-expo-consumer.sh ios-build 2>&1 | tee "$log"

      - name: Upload Expo consumer iOS xcodebuild log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: expo-consumer-ios-xcodebuild-log-${{ github.run_id }}
          path: ${{ runner.temp }}/beeui-expo-consumer-ios-xcodebuild.log
          if-no-files-found: warn
          retention-days: 2
