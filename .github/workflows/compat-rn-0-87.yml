name: compat-rn-0-87

# Gathers real, current-upstream React Native 0.87 clean-consumer evidence for
# the R2.3 compatibility row (#131) without adding native-compile cost to
# every ordinary PR. It reuses the exact same bare-consumer contract as the
# repo's own pinned RN 0.86.2 row (scripts/verify-bare-consumer.sh,
# docs/native-verification.md) with BEEUI_RN_VERSION overridden to the
# current RN 0.87 line. #137 adds the recurring/scheduled re-verification
# across this alternate row on top of the pre-existing opt-in triggers:
# - nightly: `schedule` below, offset from ci.yml (47 2 * * *) and
#   runtime-native.yml (17 3 * * *), so an upstream fix (e.g. a
#   react-native-safe-area-context release compatible with RN 0.87's
#   UIManager surface) is caught automatically instead of only on request;
# - release-candidate: `workflow_dispatch` with `release_candidate: true`
#   additionally turns off the Android leg's `continue-on-error` waiver, so
#   a regression blocks the run instead of being silently absorbed;
# - post-merge ad hoc: `gh workflow run compat-rn-0-87.yml`;
# - pre-merge peer/dependency-sensitive change: add the `ci:rn-0.87` label to
#   a pull request (mirrors the `ci:native` label pattern in
#   ci.yml/docs/ci-native-classification.md), since workflow_dispatch cannot
#   target a workflow file that only exists on a feature branch.
on:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: >-
          Release-candidate verification: the Android bare-consumer compile
          (expected red today per docs/compatibility-matrix.md's RN 0.87 row)
          stops being waived via continue-on-error and a failure blocks the
          run, instead of only being tracked as a known/diagnosed break.
        type: boolean
        default: false
  # Fork PRs never get this: the job `if:` below also requires
  # same-repo head, matching ci.yml's `ci:native` label pattern.
  pull_request:
    types: [labeled, synchronize, opened, reopened]
  schedule:
    - cron: '52 3 * * *'

permissions:
  contents: read

env:
  NODE_VERSION: 24.13.1
  PNPM_VERSION: 10.15.0
  # The current upstream React Native line proven by this workflow (#131).
  # Keep in lockstep with the "React Native — 0.87.x" row in
  # docs/compatibility-matrix.md.
  BEEUI_RN_VERSION: 0.87.1
  BEEUI_RN_CLI_VERSION: 20.2.0
  # #131 decided (with real CI evidence) to EXCLUDE RN 0.87 from @beemvp/beeui-ui's
  # declared peerDependencies range (packages/ui/package.json stays
  # ">=0.86.0 <0.87.0"), so npm's strict peer resolution correctly refuses to
  # install @beemvp/beeui-ui into an RN 0.87 project. This workflow deliberately
  # tests an out-of-range line to gather/repeat that evidence, so it must
  # bypass strict peer resolution the same way a consumer forcing the
  # combination against BeeUI's advice would.
  BEEUI_BARE_NPM_INSTALL_FLAGS: --legacy-peer-deps

jobs:
  # Expected RED today, by design, on ordinary (non-release-candidate) runs.
  # react-native-safe-area-context@5.7.0's Android Kotlin source does not
  # compile against RN 0.87's UIManager surface (a real upstream/peer
  # incompatibility documented in docs/compatibility-matrix.md's RN 0.87 row
  # and scripts/verify-bare-consumer.sh's shared consumer fixture), so this
  # job is expected to fail at the Android native compile step until that
  # dependency (or an equivalent) is proven RN-0.87-compatible.
  # continue-on-error keeps that expected, already-diagnosed failure from
  # reading as a broken/red CI signal — except on `release_candidate: true`
  # dispatch, where the row must be blocking so a candidate signoff cannot
  # silently ship on stale/waived evidence.
  bare-android-rn87:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (
        contains(github.event.pull_request.labels.*.name, 'ci:rn-0.87') &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: ${{ github.event.inputs.release_candidate != 'true' }}
    env:
      BEEUI_BARE_WORK_ROOT: ${{ github.workspace }}/.beeui-bare-rn87
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      - name: Record exact compatibility-row SHA
        run: |
          {
            echo "### Compatibility row: React Native 0.87.x (bare-consumer Android, excluded/diagnostic — #131)"
            echo "- Exact checked-out SHA: \`$(git rev-parse HEAD)\`"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Release-candidate blocking mode: \`${{ github.event.inputs.release_candidate == 'true' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Verify JavaScript toolchain
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"

      - name: pnpm store dir
        run: pnpm config set store-dir "$HOME/.pnpm-store"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.0

      - name: Install Android build dependencies
        # React Native 0.87's template pins AGP 9.2.1 / Kotlin 2.2.0 with
        # compileSdk/buildTools 37 (gradle/libs.versions.toml in the
        # react-native@0.87.1 package), one platform/build-tools generation
        # ahead of the repo's own RN 0.86.2 row. Android's SDK repository has
        # no bare "platforms;android-37" package — API level 37's baseline
        # release is only published as "platforms;android-37.0" (the new
        # major.minor platform naming Google introduced starting at this
        # level; "android-36" still has a bare alias, "android-37" does not).
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Prepare true bare React Native 0.87 consumer
        run: ./scripts/verify-bare-consumer.sh prepare

      - name: Bundle bare RN 0.87 consumer for Android and iOS
        run: ./scripts/verify-bare-consumer.sh bundle

      - name: Compile bare RN 0.87 Android debug APK
        run: ./scripts/verify-bare-consumer.sh android-build

  # Expected GREEN: the RN 0.87 bare-consumer iOS compile has no known
  # incompatibility (unlike the Android leg above) and stays a real gate for
  # this job when it does run.
  bare-ios-rn87:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (
        contains(github.event.pull_request.labels.*.name, 'ci:rn-0.87') &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      BEEUI_BARE_WORK_ROOT: ${{ github.workspace }}/.beeui-bare-rn87
      XCODE_MIN_VERSION: "26.4"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      - name: Record exact compatibility-row SHA
        run: |
          {
            echo "### Compatibility row: React Native 0.87.x (bare-consumer iOS — #131)"
            echo "- Exact checked-out SHA: \`$(git rev-parse HEAD)\`"
            echo "- Trigger: \`${{ github.event_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Select Xcode ${{ env.XCODE_MIN_VERSION }}+
        run: |
          set -euo pipefail

          selected_developer_dir=""
          selected_version=""

          version_is_supported() {
            local version="$1" min_version="$2"
            local major minor min_major min_minor
            IFS='.' read -r major minor _ <<< "$version"
            IFS='.' read -r min_major min_minor _ <<< "$min_version"
            (( ${major:-0} > ${min_major:-0} || \
               (${major:-0} == ${min_major:-0} && ${minor:-0} >= ${min_minor:-0}) ))
          }

          for app in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -rV); do
            [ -d "$app/Contents/Developer" ] || continue
            candidate="$app/Contents/Developer"
            version="$(DEVELOPER_DIR="$candidate" /usr/bin/xcodebuild -version | awk 'NR == 1 { print $2 }')"
            echo "Found $app -> Xcode $version"
            if version_is_supported "$version" "$XCODE_MIN_VERSION"; then
              selected_developer_dir="$candidate"
              selected_version="$version"
              break
            fi
          done

          if [ -z "$selected_developer_dir" ]; then
            active_version="$(/usr/bin/xcodebuild -version | awk 'NR == 1 { print $2 }')"
            echo "::error::compat-rn-0-87 requires Xcode ${XCODE_MIN_VERSION}+. Active Xcode is ${active_version}."
            exit 1
          fi

          echo "DEVELOPER_DIR=$selected_developer_dir" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$selected_developer_dir"
          echo "Using Xcode $selected_version at $DEVELOPER_DIR"
          /usr/bin/xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Verify JavaScript toolchain
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"

      - name: pnpm store dir
        run: pnpm config set store-dir "$HOME/.pnpm-store"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install darwin-arm64 workspace dependencies
        run: >
          pnpm install --frozen-lockfile --prefer-offline
          --store-dir "$HOME/.pnpm-store/beeui-v10"

      - name: Prepare true bare React Native 0.87 consumer for iOS
        run: ./scripts/verify-bare-consumer.sh prepare

      - name: Compile bare RN 0.87 consumer for iOS Simulator
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/beeui-bare-ios-rn87-xcodebuild.log"
          ./scripts/verify-bare-consumer.sh ios-build 2>&1 | tee "$log"

      - name: Upload bare iOS RN 0.87 xcodebuild log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bare-ios-rn87-xcodebuild-log-${{ github.run_id }}
          path: ${{ runner.temp }}/beeui-bare-ios-rn87-xcodebuild.log
          if-no-files-found: warn
          retention-days: 2
