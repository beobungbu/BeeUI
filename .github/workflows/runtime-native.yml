name: native-runtime-smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: native-runtime-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least-privilege default: only reads source and uploads its own job
# artifacts (via the runner's ACTIONS_RUNTIME_TOKEN, not this token's scope).
permissions:
  contents: read

env:
  NODE_VERSION: 24.13.1
  PNPM_VERSION: 10.15.0
  MAESTRO_VERSION: 2.7.0
  XCODE_MIN_VERSION: '26.4'
  BEEUI_RUNTIME_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BEEUI_RUNTIME_EXPECTED_BASE: ${{ github.event_name == 'pull_request' && github.head_ref == 'test/runtime-device-smoke' && '292b850bf7402bdf2fa3878cc80c4551f8ffd843' || '' }}

jobs:
  ios-runtime:
    # Same-repo check is defense-in-depth on top of the head_ref/label gate
    # below: a fork branch could reuse the magic branch name or a maintainer
    # could label a fork PR without realizing the runtime smoke runs on our
    # self-hosted Mac.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.head_ref == 'test/runtime-device-smoke' || contains(github.event.pull_request.labels.*.name, 'ci:runtime')))
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          fetch-depth: 0
          ref: ${{ env.BEEUI_RUNTIME_HEAD_SHA }}

      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "$BEEUI_RUNTIME_HEAD_SHA"

      - name: Add Homebrew to PATH
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Select Xcode ${{ env.XCODE_MIN_VERSION }}+
        run: |
          set -euo pipefail
          selected=""
          version_is_supported() {
            local version="$1" min_version="$2"
            local major minor min_major min_minor
            IFS='.' read -r major minor _ <<< "$version"
            IFS='.' read -r min_major min_minor _ <<< "$min_version"
            (( ${major:-0} > ${min_major:-0} || (${major:-0} == ${min_major:-0} && ${minor:-0} >= ${min_minor:-0}) ))
          }
          for app in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -rV); do
            candidate="$app/Contents/Developer"
            [ -d "$candidate" ] || continue
            version="$(DEVELOPER_DIR="$candidate" /usr/bin/xcodebuild -version | awk 'NR == 1 { print $2 }')"
            if version_is_supported "$version" "$XCODE_MIN_VERSION"; then
              selected="$candidate"
              break
            fi
          done
          test -n "$selected"
          echo "DEVELOPER_DIR=$selected" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$selected"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Setup Java for Maestro
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Enable pnpm via Corepack
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"

      - name: pnpm store dir
        run: pnpm config set store-dir "$HOME/.pnpm-store"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: pods-macos-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pods-macos-

      - name: Cache Xcode DerivedData
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: dd-macos-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: dd-macos-

      - name: Cache Maestro CLI
        uses: actions/cache@v6
        with:
          path: ~/.maestro
          key: maestro-${{ runner.os }}-${{ hashFiles('scripts/runtime-smoke/install-maestro.sh') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --store-dir "$HOME/.pnpm-store/beeui-v10"

      - name: Install pinned Maestro CLI
        run: bash ./scripts/runtime-smoke/install-maestro.sh

      - name: Run iOS Simulator smoke
        run: bash ./scripts/runtime-smoke/ios.sh

      - name: Upload iOS runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-smoke-ios-${{ env.BEEUI_RUNTIME_HEAD_SHA }}
          path: .artifacts/runtime-smoke/ios
          if-no-files-found: warn
          retention-days: 7

  android-runtime:
    # Same-repo check is defense-in-depth on top of the head_ref/label gate
    # below: a fork branch could reuse the magic branch name or a maintainer
    # could label a fork PR without realizing the runtime smoke runs on our
    # self-hosted runner.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.head_ref == 'test/runtime-device-smoke' || contains(github.event.pull_request.labels.*.name, 'ci:runtime')))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          fetch-depth: 0
          ref: ${{ env.BEEUI_RUNTIME_HEAD_SHA }}

      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "$BEEUI_RUNTIME_HEAD_SHA"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.0

      - name: Configure emulator acceleration
        run: |
          set -euo pipefail
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          if [ -e /dev/kvm ]; then
            if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
              sudo chmod 666 /dev/kvm
            fi
            test -r /dev/kvm
            test -w /dev/kvm
            echo "BEEUI_ANDROID_ACCEL=on" >> "$GITHUB_ENV"
            echo "Android emulator will use KVM hardware acceleration."
          else
            echo "::warning::No /dev/kvm on this runner; falling back to deterministic software emulation."
            echo "BEEUI_ANDROID_ACCEL=off" >> "$GITHUB_ENV"
          fi

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "emulator" \
            "platforms;android-35" "platforms;android-36" \
            "build-tools;35.0.0" "build-tools;36.0.0" \
            "ndk;27.1.12297006" "cmake;3.22.1" \
            "system-images;android-36;google_apis;x86_64"

      - name: Enable pnpm via Corepack
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"

      - name: pnpm store dir
        run: pnpm config set store-dir "$HOME/.pnpm-store"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache Maestro CLI
        uses: actions/cache@v6
        with:
          path: ~/.maestro
          key: maestro-${{ runner.os }}-${{ hashFiles('scripts/runtime-smoke/install-maestro.sh') }}

      - name: Cache Android AVD
        uses: actions/cache@v6
        with:
          path: ~/.android/avd/*
          key: avd-api36-google_apis-x86_64-pixel_7-v2-${{ runner.os }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Maestro CLI
        run: bash ./scripts/runtime-smoke/install-maestro.sh

      - name: Run Android Emulator smoke
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          avd-name: beeui-runtime-api36
          profile: pixel_7
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none -accel ${{ env.BEEUI_ANDROID_ACCEL }} -memory 4096 -cores 4 -no-snapshot
          script: bash ./scripts/runtime-smoke/android.sh

      - name: Upload Android runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-smoke-android-${{ env.BEEUI_RUNTIME_HEAD_SHA }}
          path: .artifacts/runtime-smoke/android
          if-no-files-found: warn
          retention-days: 7
