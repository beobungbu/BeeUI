name: macOS runner smoke

on:
  push:
    branches:
      - ci/macos-runner-smoke
  pull_request:
    branches:
      - main

jobs:
  smoke:
    if: >
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, beeui-macos]
    timeout-minutes: 10
    steps:
      - name: Runner process smoke
        run: |
          set -euo pipefail
          whoami
          uname -m
          sw_vers
          echo "process spawn ok"
          xcodebuild -version
          /opt/homebrew/bin/pod --version
