name: beeui-web

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 'Validation only, preview Worker deployment, or owner-authorized production Custom Domain deployment.'
        type: choice
        required: true
        default: validate
        options:
          - validate
          - preview
          - production
      production_confirmation:
        description: 'For production only, enter exactly: DEPLOY beeui.beemvp.com'
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24.13.1
  PNPM_VERSION: 10.15.0
  WRANGLER_VERSION: 4.128.0

jobs:
  build-and-local-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run public Web source contracts
        run: |
          pnpm web:check
          pnpm web:test

      - name: Build exact composed Worker artifact
        env:
          BEEUI_WEB_ENV: ci
        run: pnpm --dir web/worker build

      - name: Verify Worker runtime and Wrangler config
        run: |
          pnpm --dir web/worker typecheck
          pnpm --dir web/worker test
          pnpm --dir web/worker validate

      - name: Smoke production-like local Worker
        shell: bash
        run: |
          set -euo pipefail
          pnpm dlx "wrangler@${WRANGLER_VERSION}" dev --config web/worker/wrangler.jsonc --port 8787 >"$RUNNER_TEMP/beeui-wrangler.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            if curl --silent --fail http://127.0.0.1:8787/api/health >"$RUNNER_TEMP/health.json"; then break; fi
            sleep 1
          done
          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/health.json')); if(!j.ok||j.service!=='beeui-web'||!j.commit||!j.version) process.exit(1)"
          curl --silent --fail http://127.0.0.1:8787/ >/dev/null
          curl --silent --fail http://127.0.0.1:8787/docs/ >/dev/null
          curl --silent --fail http://127.0.0.1:8787/docs/components/reference/button/ >/dev/null
          curl --silent --fail http://127.0.0.1:8787/docs/patterns/reference/auth/sign-in-screen/ >/dev/null
          curl --silent --fail http://127.0.0.1:8787/showcase/ >/dev/null
          curl --silent --fail http://127.0.0.1:8787/demo/ >/dev/null
          curl --silent --fail http://127.0.0.1:8787/llms.txt >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8787/definitely-missing.js)" = "404"
          test "$(curl --silent --output "$RUNNER_TEMP/api-missing.json" --write-out '%{http_code}' http://127.0.0.1:8787/api/definitely-missing)" = "404"
          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/api-missing.json')); if(j.error!=='not_found') process.exit(1)"

      - name: Record exact validation identity
        if: always()
        shell: bash
        run: |
          SHA=$(git rev-parse HEAD)
          VERSION=$(node -p "require('./package.json').version")
          {
            echo "### BeeUI Web Worker validation"
            echo "- Checked-out SHA: \`${SHA}\`"
            echo "- Workspace version: \`${VERSION}\`"
            echo "- Wrangler: \`${WRANGLER_VERSION}\`"
            echo "- Production deployment performed: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target != 'validate'
    needs: build-and-local-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard owner-authorized production action
        if: github.event.inputs.target == 'production'
        env:
          CONFIRMATION: ${{ github.event.inputs.production_confirmation }}
        run: test "$CONFIRMATION" = 'DEPLOY beeui.beemvp.com'

      - name: Build exact deploy artifact
        env:
          BEEUI_WEB_ENV: ${{ github.event.inputs.target }}
        run: pnpm --dir web/worker build

      - name: Deploy preview Worker
        if: github.event.inputs.target == 'preview'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --dir web/worker deploy:preview

      - name: Deploy production Custom Domain — explicit owner action
        if: github.event.inputs.target == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --dir web/worker deploy:production

      - name: Record deployed exact identity
        shell: bash
        run: |
          SHA=$(git rev-parse HEAD)
          VERSION=$(node -p "require('./package.json').version")
          {
            echo "### BeeUI Web deployment"
            echo "- Target: \`${{ github.event.inputs.target }}\`"
            echo "- SHA: \`${SHA}\`"
            echo "- Version: \`${VERSION}\`"
            echo "- Health identity is available at \`/api/health\` on the deployed endpoint."
          } >> "$GITHUB_STEP_SUMMARY"
