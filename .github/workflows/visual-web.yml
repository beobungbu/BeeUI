name: visual-web

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - development
      - staging
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24.13.1
  PNPM_VERSION: 10.15.0

jobs:
  # Stable required PR check. Development PRs run one compact canonical +
  # Showcase smoke proof only when visual surfaces changed. Staging/main PRs
  # still run the complete suite in one required context.
  visual-web-report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Classify visual scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEEUI_FORCE_FULL_CI: ${{ github.event.pull_request.base.ref != 'development' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          set -euo pipefail
          git -c core.quotePath=false diff --name-only -z --no-renames "$BASE_SHA" "$HEAD_SHA" | node ./scripts/ci-scope.mjs
          echo "full=${BEEUI_FORCE_FULL_CI}" >> "$GITHUB_OUTPUT"
      - name: Record skipped visual proof
        if: steps.scope.outputs.visual != 'true'
        run: echo 'No visual-sensitive paths changed; required visual check is satisfied without browser provisioning.' >> "$GITHUB_STEP_SUMMARY"
      - name: Enable pinned pnpm
        if: steps.scope.outputs.visual == 'true'
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm config set store-dir "$HOME/.pnpm-store"
      - name: Cache pnpm store
        if: steps.scope.outputs.visual == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Cache Playwright browsers
        if: steps.scope.outputs.visual == 'true'
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pw-${{ runner.os }}-
      - name: Install workspace dependencies
        if: steps.scope.outputs.visual == 'true'
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Provision Chromium and Linux dependencies on cache miss
        if: steps.scope.outputs.visual == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --dir apps/visual-regression exec playwright install --with-deps chromium
      - name: Verify cached Chromium on cache hit
        if: steps.scope.outputs.visual == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends fonts-unifont
          pnpm --dir apps/visual-regression exec playwright install chromium
      - name: Build visual harness
        if: steps.scope.outputs.visual == 'true'
        run: |
          pnpm build
          pnpm --dir apps/visual-regression build:web
      - name: Compare representative screenshots for development PR
        if: steps.scope.outputs.visual == 'true' && steps.scope.outputs.full != 'true'
        run: >-
          pnpm --dir apps/visual-regression exec playwright test
          --project=mobile-light
          --project=showcase-acceptance-smoke
          --reporter=html
      - name: Compare complete screenshots for staging/main PR
        if: steps.scope.outputs.visual == 'true' && steps.scope.outputs.full == 'true'
        run: pnpm --dir apps/visual-regression exec playwright test --reporter=html
      - name: Upload PR visual report
        if: always() && steps.scope.outputs.visual == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-web-report-${{ github.event.pull_request.head.sha }}
          path: |
            apps/visual-regression/playwright-report
            apps/visual-regression/test-results
          if-no-files-found: warn
          retention-days: 7

  # Full visual evidence moves off the development PR critical path. Numeric
  # Playwright sharding produced 176/174/175 tests but ~27/43/251 seconds of
  # actual test time in run 33832785919 because the full Showcase acceptance
  # matrix landed on shard 3. Keep three runner slots, but partition by observed
  # runtime instead: ~116s canonical+smoke, ~103s Showcase integration, ~103s
  # full acceptance matrix. This removes the long-tail shard without paying a
  # fourth checkout/setup/browser provisioning cost or another concurrency slot.
  visual-web-full:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        lane: [canonical-and-smoke, showcase-integration, showcase-acceptance-matrix]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm config set store-dir "$HOME/.pnpm-store"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pw-${{ runner.os }}-
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Provision Chromium and Linux dependencies on cache miss
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --dir apps/visual-regression exec playwright install --with-deps chromium
      - name: Verify cached Chromium on cache hit
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends fonts-unifont
          pnpm --dir apps/visual-regression exec playwright install chromium
      - name: Build visual harness
        run: |
          pnpm build
          pnpm --dir apps/visual-regression build:web
      - name: Compare duration-balanced canonical screenshots
        env:
          VISUAL_LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          case "$VISUAL_LANE" in
            canonical-and-smoke)
              pnpm --dir apps/visual-regression exec playwright test \
                --project='mobile-*' \
                --project='desktop-*' \
                --project=showcase-acceptance-smoke \
                --reporter=blob
              ;;
            showcase-integration)
              pnpm --dir apps/visual-regression exec playwright test \
                --project=showcase-integration \
                --reporter=blob
              ;;
            showcase-acceptance-matrix)
              pnpm --dir apps/visual-regression exec playwright test \
                --project=showcase-acceptance-matrix \
                --reporter=blob
              ;;
            *)
              echo "Unknown visual lane: $VISUAL_LANE" >&2
              exit 2
              ;;
          esac
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-full-blob-${{ matrix.lane }}-${{ github.sha }}
          path: apps/visual-regression/blob-report
          if-no-files-found: warn
          retention-days: 3
