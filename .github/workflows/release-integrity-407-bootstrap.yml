name: release-integrity-407-bootstrap

on:
  push:
    branches:
      - fix/release-integrity-20260902

permissions:
  contents: write

env:
  NODE_VERSION: 24.13.1
  PNPM_VERSION: 10.15.0
  BEEUI_PACKAGE_VERSION: 20260902.0.0

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Install current workspace
        run: pnpm install --frozen-lockfile

      - name: Apply release-integrity fixes
        env:
          VERSION: ${{ env.BEEUI_PACKAGE_VERSION }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const VERSION = process.env.VERSION;
          const ROOT = process.cwd();
          const packageFiles = [
            'package.json',
            'packages/core/package.json',
            'packages/tokens/package.json',
            'packages/ui/package.json',
            'packages/cli/package.json',
          ];

          for (const relative of packageFiles) {
            const file = path.join(ROOT, relative);
            const json = JSON.parse(fs.readFileSync(file, 'utf8'));
            json.version = VERSION;
            if (relative === 'package.json') {
              json.scripts.lint = 'eslint packages/ui/src apps/demo/src';
              json.scripts['release-control-plane:check'] = 'node ./scripts/check-release-control-plane.mjs';
              json.scripts['release-control-plane:test'] = 'node --test ./scripts/__tests__/release-control-plane.test.mjs';
              if (!json.scripts.typecheck.includes('pnpm release-control-plane:check')) {
                json.scripts.typecheck = json.scripts.typecheck.replace(
                  'pnpm hygiene:check &&',
                  'pnpm hygiene:check && pnpm release-control-plane:check && pnpm lint &&',
                );
              }
              if (!json.scripts.test.includes('pnpm release-control-plane:test')) {
                json.scripts.test = json.scripts.test.replace(
                  'pnpm tokens:test &&',
                  'pnpm release-control-plane:test && pnpm tokens:test &&',
                );
              }
            }
            fs.writeFileSync(file, `${JSON.stringify(json, null, 2)}\n`);
          }

          const architecturePath = path.join(ROOT, 'docs/architecture.md');
          let architecture = fs.readFileSync(architecturePath, 'utf8');
          const staleFocus = 'BeeUI does not claim browser-style focus trapping or unsupported native roles. Focus, keyboard, VoiceOver/TalkBack, native sheet interaction, and destructive-confirmation interaction remain runtime/device release concerns where not automated.';
          const correctedFocus = 'On Web, Dialog owns and tests browser-style Tab focus trapping, initial focus, and focus restoration. On native, BeeUI relies on native modal/accessibility behavior and does not claim DOM focus-trap semantics or unsupported native roles. Native focus, keyboard, VoiceOver/TalkBack, native sheet interaction, and destructive-confirmation interaction remain runtime/device release concerns where not automated.';
          if (!architecture.includes(staleFocus) && !architecture.includes(correctedFocus)) {
            throw new Error('Expected Dialog focus-contract paragraph was not found in docs/architecture.md');
          }
          architecture = architecture.replace(staleFocus, correctedFocus);
          fs.writeFileSync(architecturePath, architecture);

          const releaseNote = `> **Release-integrity note (#407, 2026-09-02):** this document preserves historical evidence for candidate \`5cb061f\`. Those tarballs encode the former \`0.1.0\` package version. The current owner-selected package version authority is \`${VERSION}\`, and the visual verification harness was stabilized after \`5cb061f\` at \`18a6833\`. Therefore \`5cb061f\` MUST NOT be published as the current package set. A new immutable candidate must be stamped after #407 lands and the exact new head is green.\n\n`;
          for (const relative of ['docs/rc-candidate.md', 'docs/rc-ci-matrix.md']) {
            const file = path.join(ROOT, relative);
            let content = fs.readFileSync(file, 'utf8');
            if (!content.startsWith('> **Release-integrity note (#407')) {
              content = releaseNote + content;
              fs.writeFileSync(file, content);
            }
          }

          const report = `# Release integrity — 2026-09-02\n\nTracker: #407\n\n## Package version authority\n\nThe owner-selected date version \`20260902\` is encoded as npm-compatible SemVer \`${VERSION}\`. npm package versions must be valid SemVer, so the bare literal \`20260902\` is not a publishable npm package version.\n\nLockstep manifests covered by the release-control-plane check:\n\n- workspace root\n- \`@beemvp/beeui-core\`\n- \`@beemvp/beeui-tokens\`\n- \`@beemvp/beeui-ui\`\n- \`@beemvp/beeui-cli\`\n\n## Candidate vs verification harness\n\nThe historical immutable artifact candidate remains \`5cb061f\`; it produced the retained artifact hashes documented in \`docs/rc-candidate.md\`. The Web visual test harness was subsequently stabilized at \`18a6833\` without changing package source. This cleanup records those identities separately instead of implying that the historical candidate contains the newer test stabilization.\n\nBecause package versions now change to \`${VERSION}\`, the historical \`5cb061f\` artifacts are not publication candidates for the new version. After #407 merges and required owner/device gates are satisfied, stamp a new immutable candidate and rerun the exact-candidate matrix.\n\n## Release naming authority\n\nOnly these package names are operational release targets:\n\n- \`@beemvp/beeui-core\`\n- \`@beemvp/beeui-tokens\`\n- \`@beemvp/beeui-ui\`\n- \`@beemvp/beeui-cli\`\n\nThe legacy scope is historical-only and is mechanically rejected from release-critical tracked files.\n`;
          fs.writeFileSync(path.join(ROOT, 'docs/release-integrity-20260902.md'), report);

          for (const entry of fs.readdirSync(path.join(ROOT, '.github/workflows'))) {
            if (!entry.endsWith('.yml') && !entry.endsWith('.yaml')) continue;
            const file = path.join(ROOT, '.github/workflows', entry);
            let content = fs.readFileSync(file, 'utf8');
            content = content.replaceAll(
              'uses: actions/cache@v6',
              'uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6',
            );
            content = content.replaceAll(
              '# Fork PRs must never run on our self-hosted runners: pull_request from a\n      # fork gets a read-only, secret-less token, but the attacker-controlled\n      # checkout would still execute arbitrary code directly on our\n      # infrastructure. Push/schedule events are always same-repo.',
              '# Public-repo policy: this full verification path is intentionally limited to\n      # same-repository PRs. Fork PRs stay outside it; push/schedule events are\n      # always same-repo.',
            );
            fs.writeFileSync(file, content);
          }
          NODE

          cat > scripts/check-release-control-plane.mjs <<'EOF'
          #!/usr/bin/env node

          import fs from 'node:fs';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';

          const ROOT_DIR = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');
          export const EXPECTED_VERSION = '20260902.0.0';
          export const EXPECTED_PACKAGE_NAMES = new Map([
            ['packages/core/package.json', '@beemvp/beeui-core'],
            ['packages/tokens/package.json', '@beemvp/beeui-tokens'],
            ['packages/ui/package.json', '@beemvp/beeui-ui'],
            ['packages/cli/package.json', '@beemvp/beeui-cli'],
          ]);

          const OPERATIONAL_RELEASE_FILES = [
            'docs/release.md',
            'docs/rc-candidate.md',
            'docs/rc-ci-matrix.md',
            'docs/registry-cli.md',
            'docs/package-compatibility-report.md',
          ];

          function walkFiles(directory) {
            if (!fs.existsSync(directory)) return [];
            const files = [];
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const absolute = path.join(directory, entry.name);
              if (entry.isDirectory()) files.push(...walkFiles(absolute));
              else files.push(absolute);
            }
            return files;
          }

          export function collectReleaseControlPlaneViolations(rootDir = ROOT_DIR) {
            const violations = [];
            const rootManifest = JSON.parse(fs.readFileSync(path.join(rootDir, 'package.json'), 'utf8'));
            if (rootManifest.version !== EXPECTED_VERSION) {
              violations.push(`package.json: expected version ${EXPECTED_VERSION}, found ${rootManifest.version}`);
            }

            for (const [relative, expectedName] of EXPECTED_PACKAGE_NAMES) {
              const manifest = JSON.parse(fs.readFileSync(path.join(rootDir, relative), 'utf8'));
              if (manifest.name !== expectedName) {
                violations.push(`${relative}: expected name ${expectedName}, found ${manifest.name}`);
              }
              if (manifest.version !== EXPECTED_VERSION) {
                violations.push(`${relative}: expected version ${EXPECTED_VERSION}, found ${manifest.version}`);
              }
            }

            const releaseFiles = [
              ...walkFiles(path.join(rootDir, '.github/workflows')),
              ...walkFiles(path.join(rootDir, 'scripts')).filter(
                (file) => !file.endsWith('check-release-control-plane.mjs') && !file.includes(`${path.sep}__tests__${path.sep}`),
              ),
              ...OPERATIONAL_RELEASE_FILES.map((relative) => path.join(rootDir, relative)).filter(fs.existsSync),
              ...EXPECTED_PACKAGE_NAMES.keys().map((relative) => path.join(rootDir, relative)),
            ];
            const legacyScope = '@' + 'beeui/';
            for (const file of new Set(releaseFiles)) {
              const content = fs.readFileSync(file, 'utf8');
              if (content.includes(legacyScope)) {
                violations.push(`${path.relative(rootDir, file)}: contains superseded legacy package scope`);
              }
            }

            return violations;
          }

          const isCli = process.argv[1] && path.resolve(process.argv[1]) === fileURLToPath(import.meta.url);
          if (isCli) {
            const violations = collectReleaseControlPlaneViolations();
            if (violations.length > 0) {
              console.error('Release control-plane check failed:');
              for (const violation of violations) console.error(`- ${violation}`);
              process.exitCode = 1;
            } else {
              console.log(`Release control-plane check passed (lockstep ${EXPECTED_VERSION}, current package scope only).`);
            }
          }
          EOF

          cat > scripts/__tests__/release-control-plane.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import test from 'node:test';
          import {
            collectReleaseControlPlaneViolations,
            EXPECTED_PACKAGE_NAMES,
            EXPECTED_VERSION,
          } from '../check-release-control-plane.mjs';

          function createFixture() {
            const root = fs.mkdtempSync(path.join(os.tmpdir(), 'beeui-release-control-plane-'));
            fs.mkdirSync(path.join(root, '.github/workflows'), { recursive: true });
            fs.mkdirSync(path.join(root, 'scripts'), { recursive: true });
            fs.mkdirSync(path.join(root, 'docs'), { recursive: true });
            fs.writeFileSync(path.join(root, 'package.json'), `${JSON.stringify({ version: EXPECTED_VERSION })}\n`);
            for (const [relative, name] of EXPECTED_PACKAGE_NAMES) {
              const file = path.join(root, relative);
              fs.mkdirSync(path.dirname(file), { recursive: true });
              fs.writeFileSync(file, `${JSON.stringify({ name, version: EXPECTED_VERSION })}\n`);
            }
            for (const doc of ['release.md', 'rc-candidate.md', 'rc-ci-matrix.md', 'registry-cli.md', 'package-compatibility-report.md']) {
              fs.writeFileSync(path.join(root, 'docs', doc), 'current @beemvp package release guidance\n');
            }
            return root;
          }

          test('accepts lockstep version and current release scope', () => {
            const root = createFixture();
            assert.deepEqual(collectReleaseControlPlaneViolations(root), []);
            fs.rmSync(root, { recursive: true, force: true });
          });

          test('rejects version drift and legacy release scope', () => {
            const root = createFixture();
            const corePath = path.join(root, 'packages/core/package.json');
            const core = JSON.parse(fs.readFileSync(corePath, 'utf8'));
            core.version = '0.1.0';
            fs.writeFileSync(corePath, `${JSON.stringify(core)}\n`);
            fs.writeFileSync(path.join(root, 'docs/release.md'), 'publish @beeui/core\n');
            const violations = collectReleaseControlPlaneViolations(root);
            assert.ok(violations.some((entry) => entry.includes('packages/core/package.json: expected version')));
            assert.ok(violations.some((entry) => entry.includes('docs/release.md: contains superseded legacy package scope')));
            fs.rmSync(root, { recursive: true, force: true });
          });
          EOF

          cat > eslint.config.mjs <<'EOF'
          import tsParser from '@typescript-eslint/parser';
          import reactHooks from 'eslint-plugin-react-hooks';

          export default [
            {
              ignores: ['**/dist/**', '**/node_modules/**', '**/.expo/**'],
            },
            {
              files: ['packages/ui/src/**/*.{ts,tsx}', 'apps/demo/src/**/*.{ts,tsx}'],
              languageOptions: {
                parser: tsParser,
                parserOptions: {
                  ecmaVersion: 'latest',
                  sourceType: 'module',
                  ecmaFeatures: { jsx: true },
                },
              },
              plugins: {
                'react-hooks': reactHooks,
              },
              rules: {
                'react-hooks/rules-of-hooks': 'error',
                'react-hooks/exhaustive-deps': 'warn',
              },
            },
          ];
          EOF

      - name: Add focused lint dependencies and refresh lockfile
        run: |
          pnpm add -Dw --save-exact eslint @typescript-eslint/parser eslint-plugin-react-hooks
          pnpm install --lockfile-only

      - name: Verify release control plane
        run: pnpm release-control-plane:check

      - name: Run focused lint
        run: pnpm lint

      - name: Run repository checks
        run: pnpm check

      - name: Verify release package contract
        env:
          BEEUI_VERIFY_SHA: ${{ github.sha }}
        run: pnpm release:verify

      - name: Inspect remaining old-version references
        run: |
          echo 'Tracked 0.1.0 references (historical references may remain intentionally):'
          git grep -n '0\.1\.0' -- ':!pnpm-lock.yaml' || true

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml packages/core/package.json packages/tokens/package.json packages/ui/package.json packages/cli/package.json eslint.config.mjs scripts/check-release-control-plane.mjs scripts/__tests__/release-control-plane.test.mjs docs/architecture.md docs/rc-candidate.md docs/rc-ci-matrix.md docs/release-integrity-20260902.md .github/workflows
          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit.'
            exit 0
          fi
          git commit -m 'fix: close release-integrity gaps for 20260902 (#407)'
          git push origin HEAD:fix/release-integrity-20260902
