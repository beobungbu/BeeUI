name: registry-observe

# Read-only drift check for the committed registry observation (docs/registry-observation.json)
# — the only workflow that reaches the npm registry, strictly read-only (`npm view`; never
# `npm publish`/`npm dist-tag`, no npm token/secret). Dispatch it after a publish or `latest` move
# to confirm the committed snapshot is current; the daily schedule catches a missed refresh.
#
# It is a drift check, not a writer: it compares the live registry facts (versions, dist-tags,
# integrity/shasum per package) with the committed snapshot, ignoring the volatile
# `observedAt`/`observedBy` fields, and fails when they differ. The fix is always a reviewed
# commit made by a person: run `pnpm registry:refresh` (observation plus every generated surface
# that renders it) and open a PR into `development`. The workflow never opens that PR itself:
# GitHub Actions may not create PRs in this repository, and a PR authored with `GITHUB_TOKEN`
# would not trigger the required PR checks anyway.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 4 * * *' # daily, low-frequency backstop — see comment above

concurrency:
  group: registry-observe
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 24.13.1
  PNPM_VERSION: 10.15.0

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Read-only registry query and read-only checkout: no npm credential, no write access.
    permissions:
      contents: read
    steps:
      - name: Checkout development
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          ref: development
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"
          pnpm config set store-dir "$HOME/.pnpm-store"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # Read-only: `npm view` only. No npm token/secret is configured anywhere in this job.
      # `--check` compares facts only, so an unchanged registry never reports drift just because
      # the observation timestamp moved.
      - name: Compare the npm registry with the committed observation
        run: |
          set -o pipefail
          if pnpm --silent registry:observe:check 2>&1 | tee "$RUNNER_TEMP/registry-observe.txt"; then
            {
              echo "### Registry observation is fresh"
              echo
              echo '```'
              cat "$RUNNER_TEMP/registry-observe.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Registry observation has drifted"
              echo
              echo '```'
              cat "$RUNNER_TEMP/registry-observe.txt"
              echo '```'
              echo
              echo 'Refresh it from a checkout of `development`: run `pnpm registry:refresh`, review the diff'
              echo '(snapshot plus every regenerated surface) and open a PR into `development`.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
