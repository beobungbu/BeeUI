name: beeui-environment-ci

on:
  push:
    branches:
      - development
      - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24.13.1
  PNPM_VERSION: 10.15.0

jobs:
  environment-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact merged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complete repository type contract
        run: pnpm typecheck

      - name: Run complete repository test contract
        run: pnpm test

      - name: Record integration identity
        if: always()
        shell: bash
        run: |
          {
            echo "### BeeUI environment integration CI"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Exact SHA: \`${GITHUB_SHA}\`"
            echo "- Cloudflare credentials available: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"
