name: ci

on:
  pull_request:
    # `edited` fires when a pull request's base branch changes, and the full-CI
    # decision keys off base.ref: a PR opened against development carries
    # affected-first, reduced-scope checks, and retargeting it to main would
    # otherwise satisfy that branch's protection with the old run. Editing a
    # title or body re-runs the same lanes the diff already selects, which is
    # the cost `labeled`/`unlabeled` above already accept.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  push:
    branches:
      # Pull requests can only restore caches from their own ref, their base
      # branch and the default branch. Every pull request targets development,
      # so without a run here the native caches are never warm for anyone: each
      # one started cold and rebuilt roughly 900 MB it alone could reuse.
      - development
      - main
  schedule:
    - cron: '47 2 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24.13.1
  PNPM_VERSION: 10.15.0
  XCODE_MIN_VERSION: '26.4'

jobs:
  # Stable required check. This is the only job that always needs full history;
  # it decides which expensive proof lanes are actually relevant to the PR.
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      full-ci: ${{ steps.mode.outputs.full-ci }}
      docs-required: ${{ steps.scope.outputs.docs }}
      web-required: ${{ steps.scope.outputs.web }}
      visual-required: ${{ steps.scope.outputs.visual }}
      package-required: ${{ steps.scope.outputs.package }}
      tokens-required: ${{ steps.scope.outputs.tokens }}
      showcase-required: ${{ steps.scope.outputs.showcase }}
      consumer-required: ${{ steps.scope.outputs.consumer }}
      expo-consumer-required: ${{ steps.scope.outputs.expo-consumer }}
      release-required: ${{ steps.scope.outputs.release }}
      benchmark-required: ${{ steps.scope.outputs.benchmark }}
      package-boundary-required: ${{ steps.native.outputs.package-boundary }}
      bare-native-required: ${{ steps.native.outputs.bare-native }}
      showcase-native-required: ${{ steps.native.outputs.showcase-native }}
      ios-native-required: ${{ steps.native.outputs.ios-native }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Resolve CI mode and changed paths
        id: mode
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FORCE_FULL: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'development' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          FORCE_NATIVE: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'development' || contains(github.event.pull_request.labels.*.name, 'ci:native') }}
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/beeui-changed-paths.txt"
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            test -n "$BASE_SHA"
            test -n "$HEAD_SHA"
            git -c core.quotePath=false diff --name-only -z --no-renames "$BASE_SHA" "$HEAD_SHA" > "$changed"
          else
            : > "$changed"
          fi
          echo "changed-file=$changed" >> "$GITHUB_OUTPUT"
          echo "full-ci=$FORCE_FULL" >> "$GITHUB_OUTPUT"
          echo "force-native=$FORCE_NATIVE" >> "$GITHUB_OUTPUT"
          {
            echo '### CI impact classification'
            echo "- full CI: \`$FORCE_FULL\`"
            echo "- forced native: \`$FORCE_NATIVE\`"
            echo '- changed paths:'
            sed 's/^/  - `/' "$changed" | sed 's/$/`/' || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Classify affected verification scopes
        id: scope
        env:
          BEEUI_FORCE_FULL_CI: ${{ steps.mode.outputs.full-ci }}
        run: node ./scripts/ci-scope.mjs < "${{ steps.mode.outputs.changed-file }}"

      - name: Classify package boundary and native graphs
        id: native
        env:
          BEEUI_FORCE_NATIVE: ${{ steps.mode.outputs.force-native }}
        run: node ./scripts/classify-ci-changes.mjs < "${{ steps.mode.outputs.changed-file }}"

  # One always-on fast lane instead of eight parallel verification jobs.
  verify-fast:
    needs: [classify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Configure pnpm store
        run: pnpm config set store-dir "$HOME/.pnpm-store"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run fast repository policy and CI contracts
        run: |
          pnpm hygiene:check
          pnpm release-control-plane:check
          pnpm release-control-plane:test
          pnpm release-ruleset:check
          pnpm release-ruleset:test
          pnpm lint
          pnpm compat:check
          pnpm compat:test
          pnpm dist-policy:check
          pnpm dist-policy:test
          node --test \
            ./scripts/__tests__/classify-ci-changes.test.mjs \
            ./scripts/__tests__/ci-scope.test.mjs \
            ./scripts/__tests__/ios-build-cache-contract.test.mjs

  verify-docs:
    needs: [classify]
    if: needs.classify.outputs.full-ci == 'true' || needs.classify.outputs.docs-required == 'true' || needs.classify.outputs.web-required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm config set store-dir "$HOME/.pnpm-store"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify public docs and Web source contracts
        run: |
          pnpm docs:public-truth:check
          pnpm docs:public-truth:test
          pnpm site:contract:check
          pnpm site:contract:test
          pnpm docs:foundation:check
          pnpm docs:foundation:test
          pnpm web:check
          pnpm web:test
          pnpm llms:check
          pnpm llms:test
          pnpm ai-contract:check
          pnpm ai-contract:test
          pnpm docs:contract:check
          pnpm docs:contract:test
          pnpm docs:examples:check
          pnpm docs:examples:test
          pnpm docs:patterns:check
          pnpm docs:patterns:test

  verify-tokens:
    needs: [classify]
    if: needs.classify.outputs.full-ci == 'true' || needs.classify.outputs.tokens-required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm config set store-dir "$HOME/.pnpm-store"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify token lifecycle
        run: |
          pnpm tokens:check
          pnpm tokens:consumption-check
          pnpm tokens:test

  # Package, Showcase and registry checks share one install/build instead of
  # competing as several independent jobs. Platform exports are sequential here;
  # they are fast Metro proofs, not native compiles.
  verify-runtime:
    needs: [classify]
    if: needs.classify.outputs.full-ci == 'true' || needs.classify.outputs.package-required == 'true' || needs.classify.outputs.showcase-required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm config set store-dir "$HOME/.pnpm-store"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Cache Metro/Expo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.expo
            node_modules/.cache
            .expo
          key: metro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml','apps/showcase/app.json') }}
          restore-keys: metro-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify package build/types/exports
        if: needs.classify.outputs.full-ci == 'true' || needs.classify.outputs.package-required == 'true'
        run: |
          pnpm build
          pnpm -r --if-present typecheck
          pnpm ui-exports:check
          node --test \
            ./scripts/__tests__/generate-ui-exports.test.mjs \
            ./scripts/__tests__/verify-ui-export-map.test.mjs
      - name: Verify Showcase and registry
        if: needs.classify.outputs.full-ci == 'true' || needs.classify.outputs.showcase-required == 'true'
        run: |
          pnpm --filter @beemvp/beeui-showcase test
          pnpm registry:verify
          pnpm registry:test
      - name: Export Showcase for Web, Android and iOS
        if: needs.classify.outputs.full-ci == 'true' || needs.classify.outputs.showcase-required == 'true'
        run: |
          pnpm --filter @beemvp/beeui-showcase exec expo export --platform web --output-dir dist-web
          pnpm --filter @beemvp/beeui-showcase exec expo export --platform android --output-dir dist-android
          pnpm --filter @beemvp/beeui-showcase exec expo export --platform ios --output-dir dist-ios

  verify-release:
    needs: [classify]
    if: needs.classify.outputs.full-ci == 'true' || needs.classify.outputs.release-required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm config set store-dir "$HOME/.pnpm-store"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify release surface
        env:
          BEEUI_VERIFY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm release:verify
      - name: Pack release-equivalent artifacts
        if: github.event_name != 'pull_request'
        env:
          BEEUI_RELEASE_CANDIDATE_SHA: ${{ github.sha }}
        run: pnpm pack:artifacts
      - name: Upload release verification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/release-verification.json
          if-no-files-found: warn
          retention-days: 14

  verify-benchmark:
    needs: [classify]
    if: needs.classify.outputs.full-ci == 'true' || needs.classify.outputs.benchmark-required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm config set store-dir "$HOME/.pnpm-store"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run benchmark contract tests
        run: pnpm bench:test

  bare-consumer:
    needs: [classify]
    if: needs.classify.outputs.full-ci == 'true' || needs.classify.outputs.consumer-required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm config set store-dir "$HOME/.pnpm-store"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Prepare true bare React Native consumer
        run: ./scripts/verify-bare-consumer.sh prepare
      - name: Bundle bare consumer for Android and iOS
        run: ./scripts/verify-bare-consumer.sh bundle

  android-native:
    needs: [classify]
    if: needs.classify.outputs.bare-native-required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          add-job-summary: always
      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.0
      - name: Install Android build dependencies
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"
      - name: Enable pinned pnpm
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm config set store-dir "$HOME/.pnpm-store"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Prepare true bare React Native consumer
        run: ./scripts/verify-bare-consumer.sh prepare
      - name: Compile bare Android debug APK
        env:
          BEEUI_ANDROID_FRESH_BUILD: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: ./scripts/verify-bare-consumer.sh android-build

  # Both independent iOS proofs share one macOS VM and one dependency/toolchain
  # setup. Only the affected native graph is compiled. Xcode's content-addressed
  # CompilationCache is persisted across normal runs; weekly clean-room runs do
  # not restore it and explicitly disable compilation caching.
  ios-native:
    needs: [classify]
    if: needs.classify.outputs.ios-native-required == 'true'
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      BEEUI_XCODE_COMPILATION_CACHE: ${{ github.event_name == 'schedule' && 'NO' || 'YES' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - name: Add Homebrew to PATH
        run: echo '/opt/homebrew/bin' >> "$GITHUB_PATH"
      - name: Select Xcode ${{ env.XCODE_MIN_VERSION }}+
        id: select-xcode
        run: |
          set -euo pipefail
          selected_developer_dir=''
          selected_version=''
          version_is_supported() {
            local version="$1" min_version="$2" major minor min_major min_minor
            IFS='.' read -r major minor _ <<< "$version"
            IFS='.' read -r min_major min_minor _ <<< "$min_version"
            (( ${major:-0} > ${min_major:-0} || (${major:-0} == ${min_major:-0} && ${minor:-0} >= ${min_minor:-0}) ))
          }
          for app in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -rV); do
            candidate="$app/Contents/Developer"
            [ -d "$candidate" ] || continue
            version="$(DEVELOPER_DIR="$candidate" /usr/bin/xcodebuild -version | awk 'NR == 1 { print $2 }')"
            if version_is_supported "$version" "$XCODE_MIN_VERSION"; then
              selected_developer_dir="$candidate"
              selected_version="$version"
              break
            fi
          done
          test -n "$selected_developer_dir"
          cache_root="$HOME/Library/Caches/BeeUI"
          mkdir -p "$cache_root"
          echo "DEVELOPER_DIR=$selected_developer_dir" >> "$GITHUB_ENV"
          echo "BEEUI_XCODE_VERSION=$selected_version" >> "$GITHUB_ENV"
          echo "BEEUI_IOS_CACHE_ROOT=$cache_root" >> "$GITHUB_ENV"
          echo "version=$selected_version" >> "$GITHUB_OUTPUT"
          DEVELOPER_DIR="$selected_developer_dir" /usr/bin/xcodebuild -version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm config set store-dir "$HOME/.pnpm-store"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Restore CocoaPods and bare Bundler state
        id: pods-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
            ~/Library/Caches/BeeUI/bundle
          key: pods-macos-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pods-macos-
      - name: Restore Xcode compilation results
        id: xcode-cas
        if: github.event_name != 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/Library/Caches/BeeUI/DerivedData/**/CompilationCache.noindex
            ~/Library/Developer/Xcode/DerivedData/showcase/**/CompilationCache.noindex
          key: xcode-cas-v1-${{ runner.arch }}-${{ steps.select-xcode.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            xcode-cas-v1-${{ runner.arch }}-${{ steps.select-xcode.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}-
            xcode-cas-v1-${{ runner.arch }}-${{ steps.select-xcode.outputs.version }}-
      - name: Install darwin-arm64 workspace dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --store-dir "$HOME/.pnpm-store/beeui-v10"

      - name: Generate Showcase native project
        if: needs.classify.outputs.showcase-native-required == 'true'
        working-directory: apps/showcase
        env:
          EXPO_NO_GIT_STATUS: 1
        run: pnpm exec expo prebuild --clean --no-install
      - name: Install Showcase iOS pods
        if: needs.classify.outputs.showcase-native-required == 'true'
        working-directory: apps/showcase/ios
        run: pod install
      - name: Pin Node for Showcase Xcode phases
        if: needs.classify.outputs.showcase-native-required == 'true'
        working-directory: apps/showcase/ios
        run: printf 'export NODE_BINARY="%s"\n' "$(command -v node)" > .xcode.env.local
      - name: Discover Showcase workspace and scheme
        if: needs.classify.outputs.showcase-native-required == 'true'
        id: showcase-xcode
        working-directory: apps/showcase/ios
        run: |
          set -euo pipefail
          workspace="$(find . -maxdepth 1 -type d -name '*.xcworkspace' -print -quit)"
          test -n "$workspace"
          scheme="$({ xcodebuild -workspace "$workspace" -list -json; } | node -e '
            let input="";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const data=JSON.parse(input);
              const schemes=data.workspace?.schemes ?? [];
              if (!schemes.length) process.exit(2);
              process.stdout.write(schemes[0]);
            });
          ')"
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
      - name: Compile Showcase for iOS Simulator
        if: needs.classify.outputs.showcase-native-required == 'true'
        working-directory: apps/showcase/ios
        env:
          WORKSPACE: ${{ steps.showcase-xcode.outputs.workspace }}
          SCHEME: ${{ steps.showcase-xcode.outputs.scheme }}
        run: |
          set -euo pipefail
          safe_xcode_version="$(printf '%s' "$BEEUI_XCODE_VERSION" | tr -cs '[:alnum:].-' '_')"
          pod_hash="$(shasum -a 256 Podfile.lock | awk '{ print $1 }')"
          derived_data="$HOME/Library/Developer/Xcode/DerivedData/showcase/xcode-${safe_xcode_version}/pods-${pod_hash}"
          mkdir -p "$derived_data"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$derived_data" \
            -showBuildTimingSummary \
            COMPILATION_CACHE_ENABLE_CACHING="$BEEUI_XCODE_COMPILATION_CACHE" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/beeui-showcase-ios.log"

      - name: Prepare bare React Native consumer for iOS
        if: needs.classify.outputs.bare-native-required == 'true'
        run: ./scripts/verify-bare-consumer.sh prepare
      - name: Compile bare React Native consumer for iOS Simulator
        if: needs.classify.outputs.bare-native-required == 'true'
        # The default runner shell is `bash -e`, which ignores the exit status of
        # every command but the last in a pipeline, so a failing xcodebuild would
        # be masked by tee. `shell: bash` adds -o pipefail.
        shell: bash
        run: ./scripts/verify-bare-consumer.sh ios-build 2>&1 | tee "$RUNNER_TEMP/beeui-bare-ios.log"

      - name: Save CocoaPods and bare Bundler state
        # Pull requests restore but never save. A run on refs/pull/N writes into
        # its own cache scope, which no other pull request can read, so saving
        # there buys nothing and evicts the shared entries every pull request
        # depends on — this repository was at 9.6 of 10 GB with 92% of it held
        # by dead per-pull-request entries. Base-branch runs write the warm copy.
        if: github.event_name == 'push' && steps.pods-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
            ~/Library/Caches/BeeUI/bundle
          key: pods-macos-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Save Xcode compilation results
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/Library/Caches/BeeUI/DerivedData/**/CompilationCache.noindex
            ~/Library/Developer/Xcode/DerivedData/showcase/**/CompilationCache.noindex
          key: xcode-cas-v1-${{ runner.arch }}-${{ steps.select-xcode.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      - name: Upload iOS build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-native-xcodebuild-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/beeui-showcase-ios.log
            ${{ runner.temp }}/beeui-bare-ios.log
          if-no-files-found: warn
          retention-days: 2

  # Stable required fan-in. Optional jobs may be skipped; any job that actually
  # ran must succeed. Native failures therefore block native-sensitive PRs but
  # are absent from docs/runtime-only PR critical paths.
  verify:
    needs:
      - classify
      - verify-fast
      - verify-docs
      - verify-tokens
      - verify-runtime
      - verify-release
      - verify-benchmark
      - bare-consumer
      - android-native
      - ios-native
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected CI lane to pass
        env:
          CLASSIFY: ${{ needs.classify.result }}
          FAST: ${{ needs.verify-fast.result }}
          DOCS: ${{ needs.verify-docs.result }}
          TOKENS: ${{ needs.verify-tokens.result }}
          RUNTIME: ${{ needs.verify-runtime.result }}
          RELEASE: ${{ needs.verify-release.result }}
          BENCHMARK: ${{ needs.verify-benchmark.result }}
          BARE_CONSUMER: ${{ needs.bare-consumer.result }}
          ANDROID_NATIVE: ${{ needs.android-native.result }}
          IOS_NATIVE: ${{ needs.ios-native.result }}
        run: |
          set -euo pipefail
          test "$CLASSIFY" = success
          for result in "$FAST" "$DOCS" "$TOKENS" "$RUNTIME" "$RELEASE" "$BENCHMARK" "$BARE_CONSUMER" "$ANDROID_NATIVE" "$IOS_NATIVE"; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::selected CI lane ended as '$result'"; exit 1 ;;
            esac
          done
