name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, beeui]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Enable pnpm via Corepack
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify core packages stay Expo-free
        run: |
          if grep -R -n -E "from ['\"]expo([^'\"]*)['\"]|require\(['\"]expo([^'\"]*)['\"]\)" packages/core/src packages/ui/src; then
            echo "BeeUI core packages must not import Expo runtime modules."
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Verify release package contract
        env:
          BEEUI_VERIFY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm release:verify

      - name: Upload release verification report
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/release-verification.json
          if-no-files-found: error

      - name: Bundle showcase for web
        run: pnpm --filter @beeui/showcase exec expo export --platform web --output-dir dist-web

      - name: Bundle showcase for Android
        run: pnpm --filter @beeui/showcase exec expo export --platform android --output-dir dist-android

      - name: Bundle showcase for iOS
        run: pnpm --filter @beeui/showcase exec expo export --platform ios --output-dir dist-ios

      - name: Generate native projects with Expo Prebuild
        env:
          EXPO_NO_GIT_STATUS: 1
        working-directory: apps/showcase
        run: pnpm exec expo prebuild --clean --no-install

      - name: Upload generated iOS project
        uses: actions/upload-artifact@v4
        with:
          name: ios-prebuild-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/showcase/ios
          if-no-files-found: error
          retention-days: 1

  bare-native:
    runs-on: [self-hosted, beeui]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Enable pnpm via Corepack
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Prepare true bare React Native consumer
        run: ./scripts/verify-bare-consumer.sh prepare

      - name: Bundle bare consumer for Android and iOS
        run: ./scripts/verify-bare-consumer.sh bundle

      - name: Compile bare Android debug APK
        run: ./scripts/verify-bare-consumer.sh android-build

  ios-native:
    needs:
      - verify
      - bare-native
    if: >-
      ${{
        needs.verify.result == 'success' &&
        needs.bare-native.result == 'success' &&
        (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
      }}
    runs-on: [self-hosted, beeui-macos]
    timeout-minutes: 60
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Smoke check macOS runner
        run: |
          set -euo pipefail
          echo "user=$(whoami)"
          echo "arch=$(uname -m)"
          sw_vers
          xcodebuild -version
          pod --version
          test "$(whoami)" = "beeui-ci"
          test "$(uname -m)" = "arm64"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Enable pnpm via Corepack
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          node --version
          pnpm --version

      - name: Install macOS ARM64 workspace dependencies
        run: >-
          pnpm install
          --frozen-lockfile
          --prefer-offline
          --store-dir "$HOME/.pnpm-store/beeui-v10"

      - name: Download generated iOS project
        uses: actions/download-artifact@v4
        with:
          name: ios-prebuild-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/showcase/ios

      - name: Install iOS Pods on macOS ARM64
        working-directory: apps/showcase/ios
        run: pod install

      - name: Compile iOS Simulator app
        working-directory: apps/showcase/ios
        run: |
          set -euo pipefail

          WORKSPACE="$(find . -maxdepth 1 -type d -name '*.xcworkspace' -print -quit)"
          if [ -z "$WORKSPACE" ]; then
            echo "No generated .xcworkspace found after pod install."
            exit 1
          fi

          SCHEME="$(xcodebuild -workspace "$WORKSPACE" -list -json | python3 -c 'import json, sys; data=json.load(sys.stdin); schemes=data.get("workspace", {}).get("schemes", []); print(schemes[0] if schemes else "")')"
          if [ -z "$SCHEME" ]; then
            echo "No Xcode scheme found in $WORKSPACE."
            exit 1
          fi

          echo "workspace=$WORKSPACE"
          echo "scheme=$SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
