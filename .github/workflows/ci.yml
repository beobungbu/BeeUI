name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main
  # Nightly backstop: runs the full pristine CI (package boundary + both native
  # graphs) so PR-time shortcuts are continuously checked from clean state.
  # Offset from runtime-native.yml nightly cron (17 3 * * *).
  schedule:
    - cron: '47 2 * * *'

concurrency:
  # Keep scheduled backstops isolated from ordinary pushes to main so neither
  # can cancel the other when they overlap.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least-privilege default: this workflow only reads source and uploads its own
# job artifacts (which use the runner's ACTIONS_RUNTIME_TOKEN, not this
# GITHUB_TOKEN scope), so contents:read covers every job.
permissions:
  contents: read

env:
  NODE_VERSION: 24.13.1
  PNPM_VERSION: 10.15.0
  XCODE_MIN_VERSION: "26.4"

jobs:
  verify:
    # Fork PRs must never run on our self-hosted runners: pull_request from a
    # fork gets a read-only, secret-less token, but the attacker-controlled
    # checkout would still execute arbitrary code directly on our
    # infrastructure. Push/schedule events are always same-repo.
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, beeui]
    outputs:
      ios-native-required: ${{ steps.native-changes.outputs.ios-native }}
      ios-native-reason: ${{ steps.native-changes.outputs.reason }}
      package-boundary-required: ${{ steps.native-changes.outputs.package-boundary }}
      package-boundary-reason: ${{ steps.native-changes.outputs.package-boundary-reason }}
      bare-native-required: ${{ steps.native-changes.outputs.bare-native }}
      bare-native-reason: ${{ steps.native-changes.outputs.bare-native-reason }}
      showcase-native-required: ${{ steps.native-changes.outputs.showcase-native }}
      showcase-native-reason: ${{ steps.native-changes.outputs.showcase-native-reason }}
      # Compatibility alias retained for existing consumers of the R2 output.
      bare-consumer-required: ${{ steps.native-changes.outputs.bare-consumer }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          # The PR classifier diffs the actual base/head commits rather than
          # guessing from the synthetic pull-request merge ref.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # pnpm store is managed explicitly; setup-node v5 auto-cache would
          # target the default store path and fail the post step ("Path
          # Validation Error") when it does not exist.
          package-manager-cache: false

      - name: Test native CI policy
        run: >
          node --test
          ./scripts/__tests__/classify-ci-changes.test.mjs
          ./scripts/__tests__/ios-build-cache-contract.test.mjs

      - name: Classify package boundary and native graph verification
        id: native-changes
        env:
          BEEUI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEEUI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEEUI_FORCE_NATIVE: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:native')) }}
        run: |
          set -euo pipefail

          # Pushes to main always retain the full native proof. A maintainer can
          # also add ci:native to force the same proof on a PR. The nightly run
          # forces package-boundary, bare-native and Showcase-native tiers and
          # takes the pristine cache paths below.
          if [ "$BEEUI_FORCE_NATIVE" = "true" ]; then
            printf '' | node ./scripts/classify-ci-changes.mjs
            exit 0
          fi

          test -n "$BEEUI_BASE_SHA"
          test -n "$BEEUI_HEAD_SHA"
          # Disable rename detection so moving a file out of a package preserves
          # the deleted package path in classifier input.
          git diff --name-only --no-renames "$BEEUI_BASE_SHA" "$BEEUI_HEAD_SHA" \
            | node ./scripts/classify-ci-changes.mjs

      - name: Enable pnpm via Corepack
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Verify JavaScript toolchain
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated token artifacts
        run: pnpm tokens:check

      - name: Verify core packages stay Expo-free
        run: |
          if grep -R -n -E "from ['\"]expo([^'\"]*)['\"]|require\(['\"]expo([^'\"]*)['\"]\)" packages/core/src packages/ui/src; then
            echo "BeeUI core packages must not import Expo runtime modules."
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Verify release package contract
        env:
          BEEUI_VERIFY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm release:verify

      - name: Upload release verification report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/release-verification.json
          if-no-files-found: error

      - name: Bundle showcase for web
        run: pnpm --filter @beeui/showcase exec expo export --platform web --output-dir dist-web

      - name: Bundle showcase for Android
        run: pnpm --filter @beeui/showcase exec expo export --platform android --output-dir dist-android

      - name: Bundle showcase for iOS
        run: pnpm --filter @beeui/showcase exec expo export --platform ios --output-dir dist-ios

      - name: Generate native projects with Expo Prebuild
        if: steps.native-changes.outputs.showcase-native == 'true'
        env:
          EXPO_NO_GIT_STATUS: 1
        working-directory: apps/showcase
        run: pnpm exec expo prebuild --clean --no-install

      - name: Upload generated iOS project source
        if: steps.native-changes.outputs.showcase-native == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # run_id only (no run_attempt) so "Re-run failed jobs" on ios-native
          # still resolves the artifact uploaded by an earlier verify attempt.
          name: ios-prebuild-${{ github.run_id }}
          path: apps/showcase/ios
          if-no-files-found: error
          retention-days: 1

  bare-native:
    needs: [verify]
    # Tier A: package source changes still prove the real tarball/install/Metro
    # boundary. Tier B: Java/SDK/Gradle only run when the bare native graph can
    # actually change.
    if: >
      needs.verify.outputs.package-boundary-required == 'true' ||
      needs.verify.outputs.bare-native-required == 'true'
    runs-on: [self-hosted, beeui]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Verify JavaScript toolchain
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java
        if: needs.verify.outputs.bare-native-required == 'true'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        if: needs.verify.outputs.bare-native-required == 'true'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.0

      - name: Install Android build dependencies
        if: needs.verify.outputs.bare-native-required == 'true'
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Prepare true bare React Native consumer
        if: >
          needs.verify.outputs.package-boundary-required == 'true' ||
          needs.verify.outputs.bare-native-required == 'true'
        run: ./scripts/verify-bare-consumer.sh prepare

      - name: Bundle bare consumer for Android and iOS
        if: >
          needs.verify.outputs.package-boundary-required == 'true' ||
          needs.verify.outputs.bare-native-required == 'true'
        run: ./scripts/verify-bare-consumer.sh bundle

      - name: Compile bare Android debug APK
        if: needs.verify.outputs.bare-native-required == 'true'
        run: ./scripts/verify-bare-consumer.sh android-build

  ios-native:
    needs: [verify, bare-native]
    # The macOS job is now a native-graph proof, not a JS correctness proof.
    # Pure BeeUI/Showcase JS changes are already covered by release verification
    # and Metro exports. Fork PRs still cannot execute on the self-hosted Mac.
    if: >
      always() &&
      needs.verify.result == 'success' &&
      (needs.bare-native.result == 'success' || needs.bare-native.result == 'skipped') &&
      needs.verify.outputs.ios-native-required == 'true' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: [self-hosted, beeui-macos]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      - name: Add Homebrew to PATH
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Select Xcode ${{ env.XCODE_MIN_VERSION }}+
        run: |
          set -euo pipefail

          selected_developer_dir=""
          selected_version=""

          version_is_supported() {
            local version="$1" min_version="$2"
            local major minor min_major min_minor
            IFS='.' read -r major minor _ <<< "$version"
            IFS='.' read -r min_major min_minor _ <<< "$min_version"
            (( ${major:-0} > ${min_major:-0} || \
               (${major:-0} == ${min_major:-0} && ${minor:-0} >= ${min_minor:-0}) ))
          }

          # Prefer the highest installed Xcode so we track Expo's tested
          # toolchain (SDK 57 targets Xcode 26.6), not merely the first >= min.
          for app in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -rV); do
            [ -d "$app/Contents/Developer" ] || continue
            candidate="$app/Contents/Developer"
            version="$(DEVELOPER_DIR="$candidate" /usr/bin/xcodebuild -version | awk 'NR == 1 { print $2 }')"
            echo "Found $app -> Xcode $version"
            if version_is_supported "$version" "$XCODE_MIN_VERSION"; then
              selected_developer_dir="$candidate"
              selected_version="$version"
              break
            fi
          done

          if [ -z "$selected_developer_dir" ]; then
            active_version="$(/usr/bin/xcodebuild -version | awk 'NR == 1 { print $2 }')"
            echo "::error::Expo SDK 57 native CI requires Xcode ${XCODE_MIN_VERSION}+. Active Xcode is ${active_version}. Downloading the iOS Simulator runtime does not upgrade Xcode."
            exit 1
          fi

          cache_root="$HOME/Library/Caches/BeeUI"
          mkdir -p "$cache_root"
          echo "DEVELOPER_DIR=$selected_developer_dir" >> "$GITHUB_ENV"
          echo "BEEUI_XCODE_VERSION=$selected_version" >> "$GITHUB_ENV"
          echo "BEEUI_IOS_CACHE_ROOT=$cache_root" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$selected_developer_dir"
          echo "Using Xcode $selected_version at $DEVELOPER_DIR"
          echo "Using persistent iOS cache root $cache_root"
          /usr/bin/xcodebuild -version
          /usr/bin/xcrun --sdk iphonesimulator --show-sdk-version
          /usr/bin/xcrun swift --version

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Verify JavaScript toolchain
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"

      - name: Install darwin-arm64 workspace dependencies
        run: >
          pnpm install --frozen-lockfile --prefer-offline
          --store-dir "$HOME/.pnpm-store/beeui-v10"

      - name: Download generated iOS project source
        if: needs.verify.outputs.showcase-native-required == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-prebuild-${{ github.run_id }}
          path: apps/showcase/ios

      - name: Install iOS pods locally
        if: needs.verify.outputs.showcase-native-required == 'true'
        working-directory: apps/showcase/ios
        env:
          # Nightly schedule runs always execute a real pod install on the
          # freshly downloaded prebuild tree. It deliberately bypasses cache
          # restore so the pristine backstop cannot compile stale native files.
          BEEUI_PODS_FRESH: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: |
          set -euo pipefail

          # `pod install` writes Pods/, workspace/project integration, and RN
          # codegen output under build/generated/. We therefore cache the whole
          # post-install ios/ tree. To make restoring that tree safe, derive the
          # cache key from the ENTIRE freshly downloaded prebuild tree BEFORE
          # any restore, plus workspace dependency/app config inputs. Any native
          # source/config/plugin output change therefore forces a miss instead
          # of allowing an older snapshot to overwrite the new prebuild.
          safe_xcode_version="$(printf '%s' "$BEEUI_XCODE_VERSION" | tr -cs '[:alnum:].-' '_')"
          prebuild_hash="$({
            find . \( -type f -o -type l \) ! -name '.xcode.env.local' -print \
              | LC_ALL=C sort \
              | while IFS= read -r path; do
                  if [ -L "$path" ]; then
                    printf 'L %s %s\n' "$path" "$(readlink "$path")"
                  else
                    printf 'F %s ' "$path"
                    shasum -a 256 "$path" | awk '{ print $1 }'
                  fi
                done
          } | shasum -a 256 | awk '{ print $1 }')"
          lock_hash="$(shasum -a 256 "$GITHUB_WORKSPACE/pnpm-lock.yaml" | awk '{ print $1 }')"
          app_hash="$(shasum -a 256 "$GITHUB_WORKSPACE/apps/showcase/app.json" | awk '{ print $1 }')"
          pods_key="$(printf '%s\n%s\n%s\n' "$prebuild_hash" "$lock_hash" "$app_hash" | shasum -a 256 | awk '{ print $1 }')"
          cache="$BEEUI_IOS_CACHE_ROOT/pods-cache/showcase/xcode-${safe_xcode_version}/key-${pods_key}"

          restore_ok=0
          if [ -n "${BEEUI_PODS_FRESH:-}" ]; then
            echo "Fresh pod install requested; bypassing ios/ snapshot restore."
          elif [ -d "$cache/ios" ]; then
            echo "Restoring cached post-install ios/ snapshot for key ${pods_key}"
            if rsync -a --delete "$cache/ios/" ./; then
              restore_ok=1
            else
              echo "::warning::ios/ snapshot restore failed; falling back to a full pod install without deleting the working tree."
            fi
          else
            echo "No pod-install snapshot cache hit for key ${pods_key}; running a full pod install."
          fi

          ran_pod_install=0
          if [ "$restore_ok" -eq 1 ] && cmp -s Pods/Manifest.lock Podfile.lock; then
            echo "Pods manifest matches restored lockfile; skipping pod install."
          else
            /opt/homebrew/bin/pod install
            ran_pod_install=1
          fi

          if [ "$ran_pod_install" -eq 1 ]; then
            echo "Refreshing pod-install snapshot cache at $cache"
            tmp_cache="${cache}.tmp-$$"
            # .xcode.env.local is written by the later "Pin Node binary for
            # Xcode build scripts" step, not by pod install, so it should
            # never exist yet here; excluding it is belt-and-suspenders.
            if mkdir -p "$tmp_cache/ios" \
              && rsync -a --delete --exclude '.xcode.env.local' ./ "$tmp_cache/ios/"; then
              rm -rf "$cache"
              mv "$tmp_cache" "$cache"
            else
              echo "::warning::Failed to refresh pod-install snapshot cache; a future run will fall back to a full pod install."
              rm -rf "$tmp_cache"
            fi
          fi

      - name: Pin Node binary for Xcode build scripts
        if: needs.verify.outputs.showcase-native-required == 'true'
        working-directory: apps/showcase/ios
        run: |
          set -euo pipefail
          node_binary="$(command -v node)"
          test "$(node --version)" = "v${NODE_VERSION}"
          printf 'export NODE_BINARY="%s"\n' "$node_binary" > .xcode.env.local
          echo "Pinned Xcode NODE_BINARY=$node_binary"

      - name: Discover generated Xcode workspace and scheme
        if: needs.verify.outputs.showcase-native-required == 'true'
        id: xcode
        working-directory: apps/showcase/ios
        run: |
          set -euo pipefail

          workspace="$(find . -maxdepth 1 -type d -name '*.xcworkspace' -print -quit)"
          if [ -z "$workspace" ]; then
            echo "No generated .xcworkspace found after pod install."
            exit 1
          fi

          scheme="$({ xcodebuild -workspace "$workspace" -list -json; } | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const data = JSON.parse(input);
              const schemes = data.workspace?.schemes ?? [];
              if (!schemes.length) process.exit(2);
              process.stdout.write(schemes[0]);
            });
          ')"

          if [ -z "$scheme" ]; then
            echo "No shared Xcode scheme found in $workspace."
            exit 1
          fi

          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
          echo "Using workspace $workspace with scheme $scheme"

      - name: Compile Showcase for iOS Simulator
        if: needs.verify.outputs.showcase-native-required == 'true'
        id: ios-build
        working-directory: apps/showcase/ios
        env:
          WORKSPACE: ${{ steps.xcode.outputs.workspace }}
          SCHEME: ${{ steps.xcode.outputs.scheme }}
        run: |
          set -euo pipefail
          test -f Podfile.lock

          safe_xcode_version="$(printf '%s' "$BEEUI_XCODE_VERSION" | tr -cs '[:alnum:].-' '_')"
          pod_hash="$(shasum -a 256 Podfile.lock | awk '{ print $1 }')"
          derived_data="$BEEUI_IOS_CACHE_ROOT/DerivedData/showcase/xcode-${safe_xcode_version}/pods-${pod_hash}"
          mkdir -p "$derived_data"

          log="$RUNNER_TEMP/beeui-xcodebuild.log"
          echo "Using persistent Showcase DerivedData: $derived_data"
          # 'generic/platform=iOS Simulator' builds without booting a specific
          # runtime — we only compile, never run, so no simulator is needed.
          # Xcode 26 compilation caching is keyed by compiler inputs and
          # complements incremental DerivedData reuse across PRs/branches.
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$derived_data" \
            -showBuildTimingSummary \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$log"

      - name: Upload xcodebuild log
        if: always() && needs.verify.outputs.showcase-native-required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-xcodebuild-log-${{ github.run_id }}
          path: ${{ runner.temp }}/beeui-xcodebuild.log
          if-no-files-found: warn
          retention-days: 2

      - name: Prepare true bare React Native consumer for iOS
        if: needs.verify.outputs.bare-native-required == 'true'
        env:
          # Nightly schedule runs take the full-clean path so reuse is validated
          # against a pristine environment.
          BEEUI_BARE_CLEAN: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: ./scripts/verify-bare-consumer.sh prepare

      - name: Compile bare React Native consumer for iOS Simulator
        if: needs.verify.outputs.bare-native-required == 'true'
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/beeui-bare-ios-xcodebuild.log"
          ./scripts/verify-bare-consumer.sh ios-build 2>&1 | tee "$log"

      - name: Upload bare iOS xcodebuild log
        if: always() && needs.verify.outputs.bare-native-required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bare-ios-xcodebuild-log-${{ github.run_id }}
          path: ${{ runner.temp }}/beeui-bare-ios-xcodebuild.log
          if-no-files-found: warn
          retention-days: 2
