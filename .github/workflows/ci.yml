name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main
  schedule:
    - cron: '47 2 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24.13.1
  PNPM_VERSION: 10.15.0
  XCODE_MIN_VERSION: "26.4"

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      ios-native-required: ${{ steps.native-changes.outputs.ios-native }}
      ios-native-reason: ${{ steps.native-changes.outputs.reason }}
      package-boundary-required: ${{ steps.native-changes.outputs.package-boundary }}
      package-boundary-reason: ${{ steps.native-changes.outputs.package-boundary-reason }}
      bare-native-required: ${{ steps.native-changes.outputs.bare-native }}
      bare-native-reason: ${{ steps.native-changes.outputs.bare-native-reason }}
      showcase-native-required: ${{ steps.native-changes.outputs.showcase-native }}
      showcase-native-reason: ${{ steps.native-changes.outputs.showcase-native-reason }}
      bare-consumer-required: ${{ steps.native-changes.outputs.bare-consumer }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # Keep classification itself on the shortest possible critical path.
      # Policy/contract tests run in the parallel contracts lane below.
      - name: Classify package boundary and native graph verification
        id: native-changes
        env:
          BEEUI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEEUI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEEUI_FORCE_NATIVE: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:native')) }}
        run: |
          set -euo pipefail
          if [ "$BEEUI_FORCE_NATIVE" = "true" ]; then
            printf '' | node ./scripts/classify-ci-changes.mjs
            exit 0
          fi
          test -n "$BEEUI_BASE_SHA"
          test -n "$BEEUI_HEAD_SHA"
          git diff --name-only --no-renames "$BEEUI_BASE_SHA" "$BEEUI_HEAD_SHA" \
            | node ./scripts/classify-ci-changes.mjs

  # package.json's historical `typecheck` + `test` commands are intentionally
  # decomposed here. Each lane preserves the same checks while eliminating the
  # long serial chain from CI's critical path.
  verify-lane:
    name: verify-${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        task:
          - quality
          - tokens
          - contracts
          - docs
          - types
          - showcase-registry
          - bench
          - release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Verify JavaScript toolchain
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"

      - name: pnpm store dir
        run: pnpm config set store-dir "$HOME/.pnpm-store"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verification lane
        env:
          BEEUI_VERIFY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          case "${{ matrix.task }}" in
            quality)
              pnpm hygiene:check
              pnpm release-control-plane:check
              pnpm lint
              pnpm release-control-plane:test
              ;;
            tokens)
              pnpm tokens:check
              pnpm tokens:consumption-check
              pnpm tokens:test
              ;;
            contracts)
              pnpm compat:check
              pnpm compat:test
              pnpm release-ruleset:check
              pnpm release-ruleset:test
              pnpm dist-policy:check
              pnpm dist-policy:test
              node --test \
                ./scripts/__tests__/classify-ci-changes.test.mjs \
                ./scripts/__tests__/ios-build-cache-contract.test.mjs
              ;;
            docs)
              pnpm llms:check
              pnpm llms:test
              pnpm ai-contract:check
              pnpm ai-contract:test
              pnpm docs:contract:check
              pnpm docs:contract:test
              pnpm docs:examples:check
              pnpm docs:examples:test
              pnpm docs:patterns:check
              pnpm docs:patterns:test
              ;;
            types)
              pnpm build
              pnpm -r --if-present typecheck
              pnpm ui-exports:check
              node --test \
                ./scripts/__tests__/generate-ui-exports.test.mjs \
                ./scripts/__tests__/verify-ui-export-map.test.mjs
              ;;
            showcase-registry)
              pnpm --filter @beemvp/beeui-showcase test
              pnpm registry:verify
              pnpm registry:test
              ;;
            bench)
              pnpm bench:test
              ;;
            release)
              pnpm release:verify
              ;;
            *)
              echo "Unknown verification lane: ${{ matrix.task }}"
              exit 2
              ;;
          esac

      - name: Upload release verification report
        if: matrix.task == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/release-verification.json
          if-no-files-found: error
          retention-days: 14

      - name: Pack prerelease-equivalent artifacts
        if: matrix.task == 'release' && github.event_name != 'pull_request'
        env:
          BEEUI_RELEASE_CANDIDATE_SHA: ${{ github.sha }}
        run: pnpm pack:artifacts

      - name: Upload prerelease-equivalent artifacts
        if: matrix.task == 'release' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-artifacts-${{ github.sha }}
          path: .artifacts/pack
          if-no-files-found: error
          retention-days: 14

  showcase-bundle:
    name: showcase-bundle-${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [web, android, ios]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: pnpm store dir
        run: pnpm config set store-dir "$HOME/.pnpm-store"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache Metro/Expo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.expo
            node_modules/.cache
            .expo
          key: metro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml','apps/showcase/app.json') }}
          restore-keys: metro-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle Showcase for ${{ matrix.platform }}
        run: >
          pnpm --filter @beemvp/beeui-showcase exec expo export
          --platform "${{ matrix.platform }}"
          --output-dir "dist-${{ matrix.platform }}"

  verify:
    needs: [classify, verify-lane, showcase-bundle]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification lane to pass
        run: |
          test "${{ needs.classify.result }}" = "success"
          test "${{ needs.verify-lane.result }}" = "success"
          test "${{ needs.showcase-bundle.result }}" = "success"

  bare-bundle:
    needs: [classify]
    if: >
      needs.classify.outputs.package-boundary-required == 'true' ||
      needs.classify.outputs.bare-native-required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: pnpm store dir
        run: pnpm config set store-dir "$HOME/.pnpm-store"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare true bare React Native consumer
        run: ./scripts/verify-bare-consumer.sh prepare

      - name: Bundle bare consumer for Android and iOS
        run: ./scripts/verify-bare-consumer.sh bundle

  bare-android:
    needs: [classify]
    if: needs.classify.outputs.bare-native-required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: pnpm store dir
        run: pnpm config set store-dir "$HOME/.pnpm-store"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.0

      - name: Install Android build dependencies
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Prepare true bare React Native consumer
        run: ./scripts/verify-bare-consumer.sh prepare

      - name: Compile bare Android debug APK
        run: ./scripts/verify-bare-consumer.sh android-build

  ios-showcase:
    needs: [classify]
    if: needs.classify.outputs.showcase-native-required == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      - name: Add Homebrew to PATH
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Select Xcode ${{ env.XCODE_MIN_VERSION }}+
        run: |
          set -euo pipefail
          selected_developer_dir=""
          selected_version=""
          version_is_supported() {
            local version="$1" min_version="$2"
            local major minor min_major min_minor
            IFS='.' read -r major minor _ <<< "$version"
            IFS='.' read -r min_major min_minor _ <<< "$min_version"
            (( ${major:-0} > ${min_major:-0} || (${major:-0} == ${min_major:-0} && ${minor:-0} >= ${min_minor:-0}) ))
          }
          for app in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -rV); do
            [ -d "$app/Contents/Developer" ] || continue
            candidate="$app/Contents/Developer"
            version="$(DEVELOPER_DIR="$candidate" /usr/bin/xcodebuild -version | awk 'NR == 1 { print $2 }')"
            if version_is_supported "$version" "$XCODE_MIN_VERSION"; then
              selected_developer_dir="$candidate"
              selected_version="$version"
              break
            fi
          done
          test -n "$selected_developer_dir"
          echo "DEVELOPER_DIR=$selected_developer_dir" >> "$GITHUB_ENV"
          echo "BEEUI_XCODE_VERSION=$selected_version" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$selected_developer_dir"
          /usr/bin/xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: pnpm store dir
        run: pnpm config set store-dir "$HOME/.pnpm-store"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: pods-macos-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pods-macos-

      - name: Install darwin-arm64 workspace dependencies
        run: >
          pnpm install --frozen-lockfile --prefer-offline
          --store-dir "$HOME/.pnpm-store/beeui-v10"

      - name: Generate native projects with Expo Prebuild
        env:
          EXPO_NO_GIT_STATUS: 1
        working-directory: apps/showcase
        run: pnpm exec expo prebuild --clean --no-install

      - name: Install iOS pods locally
        working-directory: apps/showcase/ios
        run: pod install

      - name: Pin Node binary for Xcode build scripts
        working-directory: apps/showcase/ios
        run: printf 'export NODE_BINARY="%s"\n' "$(command -v node)" > .xcode.env.local

      - name: Discover generated Xcode workspace and scheme
        id: xcode
        working-directory: apps/showcase/ios
        run: |
          set -euo pipefail
          workspace="$(find . -maxdepth 1 -type d -name '*.xcworkspace' -print -quit)"
          test -n "$workspace"
          scheme="$({ xcodebuild -workspace "$workspace" -list -json; } | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const data = JSON.parse(input);
              const schemes = data.workspace?.schemes ?? [];
              if (!schemes.length) process.exit(2);
              process.stdout.write(schemes[0]);
            });
          ')"
          test -n "$scheme"
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"

      - name: Compile Showcase for iOS Simulator
        working-directory: apps/showcase/ios
        env:
          WORKSPACE: ${{ steps.xcode.outputs.workspace }}
          SCHEME: ${{ steps.xcode.outputs.scheme }}
        run: |
          set -euo pipefail
          test -f Podfile.lock
          safe_xcode_version="$(printf '%s' "$BEEUI_XCODE_VERSION" | tr -cs '[:alnum:].-' '_')"
          pod_hash="$(shasum -a 256 Podfile.lock | awk '{ print $1 }')"
          derived_data="$HOME/Library/Developer/Xcode/DerivedData/showcase/xcode-${safe_xcode_version}/pods-${pod_hash}"
          mkdir -p "$derived_data"
          log="$RUNNER_TEMP/beeui-xcodebuild.log"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$derived_data" \
            -showBuildTimingSummary \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$log"

      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-showcase-xcodebuild-${{ github.run_id }}
          path: ${{ runner.temp }}/beeui-xcodebuild.log
          if-no-files-found: warn
          retention-days: 2

  ios-bare:
    needs: [classify]
    if: needs.classify.outputs.bare-native-required == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      - name: Add Homebrew to PATH
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Select Xcode ${{ env.XCODE_MIN_VERSION }}+
        run: |
          set -euo pipefail
          selected_developer_dir=""
          selected_version=""
          version_is_supported() {
            local version="$1" min_version="$2"
            local major minor min_major min_minor
            IFS='.' read -r major minor _ <<< "$version"
            IFS='.' read -r min_major min_minor _ <<< "$min_version"
            (( ${major:-0} > ${min_major:-0} || (${major:-0} == ${min_major:-0} && ${minor:-0} >= ${min_minor:-0}) ))
          }
          for app in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -rV); do
            [ -d "$app/Contents/Developer" ] || continue
            candidate="$app/Contents/Developer"
            version="$(DEVELOPER_DIR="$candidate" /usr/bin/xcodebuild -version | awk 'NR == 1 { print $2 }')"
            if version_is_supported "$version" "$XCODE_MIN_VERSION"; then
              selected_developer_dir="$candidate"
              selected_version="$version"
              break
            fi
          done
          test -n "$selected_developer_dir"
          cache_root="$HOME/Library/Caches/BeeUI"
          mkdir -p "$cache_root"
          echo "DEVELOPER_DIR=$selected_developer_dir" >> "$GITHUB_ENV"
          echo "BEEUI_XCODE_VERSION=$selected_version" >> "$GITHUB_ENV"
          echo "BEEUI_IOS_CACHE_ROOT=$cache_root" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$selected_developer_dir"
          /usr/bin/xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: pnpm store dir
        run: pnpm config set store-dir "$HOME/.pnpm-store"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: pods-macos-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pods-macos-

      - name: Install darwin-arm64 workspace dependencies
        run: >
          pnpm install --frozen-lockfile --prefer-offline
          --store-dir "$HOME/.pnpm-store/beeui-v10"

      - name: Prepare true bare React Native consumer for iOS
        run: ./scripts/verify-bare-consumer.sh prepare

      - name: Compile bare React Native consumer for iOS Simulator
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/beeui-bare-ios-xcodebuild.log"
          ./scripts/verify-bare-consumer.sh ios-build 2>&1 | tee "$log"

      - name: Upload bare iOS xcodebuild log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bare-ios-xcodebuild-${{ github.run_id }}
          path: ${{ runner.temp }}/beeui-bare-ios-xcodebuild.log
          if-no-files-found: warn
          retention-days: 2
