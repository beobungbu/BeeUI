name: release-integrity-407-apply

on:
  push:
    branches:
      - fix/release-integrity-20260902

permissions:
  contents: write

concurrency:
  group: release-integrity-407-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.13.1
  PNPM_VERSION: 10.15.0

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          fetch-depth: 0

      - name: Capture immutable start SHA
        run: echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Install current workspace
        run: pnpm install --frozen-lockfile

      - name: Apply previously verified release-integrity migration
        run: |
          node scripts/.tmp-apply-release-integrity-407.mjs
          node scripts/.tmp-finalize-release-policy-407.mjs

      - name: Add focused lint dependencies and refresh lockfile
        run: |
          pnpm add -Dw --save-exact eslint@10.9.1 @typescript-eslint/parser@8.69.0 eslint-plugin-react-hooks@7.1.1
          pnpm install --lockfile-only

      - name: Regenerate AI-facing release docs
        run: pnpm llms:generate

      - name: Verify focused guard and lint
        run: |
          pnpm release-control-plane:check
          pnpm lint

      - name: Run full repository checks
        run: pnpm check

      - name: Build final non-workflow commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore --source="$START_SHA" -- .github/workflows
          rm -f scripts/.tmp-apply-release-integrity-407.mjs scripts/.tmp-finalize-release-policy-407.mjs
          git add -A
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          ! git ls-files --error-unmatch scripts/.tmp-apply-release-integrity-407.mjs >/dev/null 2>&1
          ! git ls-files --error-unmatch scripts/.tmp-finalize-release-policy-407.mjs >/dev/null 2>&1
          git diff --cached --check
          git diff --cached --quiet && { echo 'No cleanup changes to commit.'; exit 1; }
          git commit -m 'fix: close release-integrity gaps for 20260902 (#407)'
          test -z "$(git diff --name-only "$START_SHA" HEAD -- .github/workflows)"
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify release package contract on exact local final head
        run: BEEUI_VERIFY_SHA="$FINAL_SHA" pnpm release:verify

      - name: Inspect version residue
        run: |
          echo 'Remaining tracked 0.1.0 references (historical references may remain intentionally):'
          git grep -n '0\.1\.0' -- ':!pnpm-lock.yaml' || true

      - name: Guard remote head and push verified non-workflow commit
        run: |
          set -euo pipefail
          git fetch origin fix/release-integrity-20260902
          REMOTE_SHA=$(git rev-parse FETCH_HEAD)
          test "$REMOTE_SHA" = "$START_SHA" || {
            echo "Remote branch moved: start=$START_SHA remote=$REMOTE_SHA" >&2
            exit 1
          }
          git push origin HEAD:fix/release-integrity-20260902
