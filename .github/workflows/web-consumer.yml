name: web-consumer

on:
  pull_request:
  push:
    branches:
      - main
  # #137: weekly recurring re-verification of the independent Web consumer
  # contract (#136) even on weeks with no PR/push activity touching it —
  # every run already installs fresh (BEEUI_WEB_CONSUMER_CLEAN below), so
  # this catches drift from outside this repo's own commits (e.g. a
  # `vite-plugin-rnw`/Vite/Playwright-Chromium update). Offset from the other
  # nightly compatibility crons (ci.yml 47 2 * * *, runtime-native.yml
  # 17 3 * * *, compat-rn-0-87.yml 52 3 * * *).
  schedule:
    - cron: '22 4 * * 1'
  workflow_dispatch:
    inputs:
      release_candidate:
        description: 'Release-candidate verification run (recorded in the job summary; this row is already a real blocking gate either way).'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least-privilege default: only reads source and uploads its own job
# artifacts (via the runner's ACTIONS_RUNTIME_TOKEN, not this token's scope).
permissions:
  contents: read

env:
  NODE_VERSION: 24.13.1
  PNPM_VERSION: 10.15.0

jobs:
  web-consumer:
    # Fork PRs must never run on our self-hosted runner: the attacker-
    # controlled checkout would execute arbitrary code directly on our
    # infrastructure regardless of GITHUB_TOKEN scope. Push events are
    # always same-repo.
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      - name: Record exact compatibility-row SHA
        run: |
          {
            echo "### Compatibility row: independent Vite + react-native-web consumer (#136)"
            echo "- Exact checked-out SHA: \`$(git rev-parse HEAD)\`"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Release-candidate run: \`${{ github.event.inputs.release_candidate == 'true' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Verify JavaScript toolchain
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"

      - name: pnpm store dir
        run: pnpm config set store-dir "$HOME/.pnpm-store"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pw-${{ runner.os }}-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision pinned Chromium and Linux dependencies
        run: pnpm --dir apps/visual-regression exec playwright install ${{ steps.pw-cache.outputs.cache-hit == 'true' && '' || '--with-deps' }} chromium

      # Issue #136 — the independent, non-Showcase clean Web consumer: packs
      # @beeui/core/@beeui/tokens/@beeui/ui, installs them (plus the exact
      # runtime/tooling versions docs/compatibility-matrix.md's Web support
      # contract claims) into an isolated Vite + react-native-web app with no
      # monorepo fallback, proves the production build, then drives real
      # Chromium interaction (forms, overlays, Select, Tooltip, Sheet, Table,
      # Calendar, keyboard dismissal) plus an axe-core accessibility scan.
      - name: Verify the independent Vite + react-native-web consumer
        env:
          BEEUI_WEB_CONSUMER_WORK_ROOT: ${{ runner.temp }}/beeui-web-consumer
          BEEUI_WEB_CONSUMER_CLEAN: '1'
        run: bash scripts/verify-web-consumer.sh all

      - name: Upload consumer build output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-consumer-dist-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/beeui-web-consumer/app/dist
          if-no-files-found: warn
          retention-days: 3
