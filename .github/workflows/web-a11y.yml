name: web-a11y

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - development
      - staging
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24.13.1
  PNPM_VERSION: 10.15.0

jobs:
  web-a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Classify accessibility scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEEUI_FORCE_FULL_CI: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'development' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = pull_request ]; then
            git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" | node ./scripts/ci-scope.mjs
          else
            printf '' | node ./scripts/ci-scope.mjs
          fi
      - name: Record unaffected accessibility check
        if: steps.scope.outputs.visual != 'true'
        run: echo 'No accessibility/visual-sensitive surfaces changed; browser audit skipped.' >> "$GITHUB_STEP_SUMMARY"
      - name: Enable pinned pnpm
        if: steps.scope.outputs.visual == 'true'
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm config set store-dir "$HOME/.pnpm-store"
      - name: Cache pnpm store
        if: steps.scope.outputs.visual == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Cache Playwright browsers
        if: steps.scope.outputs.visual == 'true'
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pw-${{ runner.os }}-
      - name: Install workspace dependencies
        if: steps.scope.outputs.visual == 'true'
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Provision Chromium and Linux dependencies on cache miss
        if: steps.scope.outputs.visual == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --dir apps/visual-regression exec playwright install --with-deps chromium
      - name: Verify cached Chromium on cache hit
        if: steps.scope.outputs.visual == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --dir apps/visual-regression exec playwright install chromium
      - name: Run Web accessibility audit
        if: steps.scope.outputs.visual == 'true'
        run: pnpm --dir apps/visual-regression test:a11y
      - name: Upload accessibility audit report
        if: always() && steps.scope.outputs.visual == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-a11y-report-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/visual-regression/a11y-report
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Playwright diagnostics
        if: failure() && steps.scope.outputs.visual == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-a11y-playwright-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            apps/visual-regression/test-results
            apps/visual-regression/playwright-report
          if-no-files-found: warn
          retention-days: 3
