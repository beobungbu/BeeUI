name: web-a11y

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least-privilege default: only reads source and uploads its own job
# artifacts (via the runner's ACTIONS_RUNTIME_TOKEN, not this token's scope).
permissions:
  contents: read

env:
  NODE_VERSION: 24.13.1
  PNPM_VERSION: 10.15.0

jobs:
  web-a11y:
    # Fork PRs must never run on our self-hosted runner: the attacker-
    # controlled checkout would execute arbitrary code directly on our
    # infrastructure regardless of GITHUB_TOKEN scope. Push events are
    # always same-repo.
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          npm install -g corepack@0.33.0
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Verify JavaScript toolchain
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"

      - name: pnpm store dir
        run: pnpm config set store-dir "$HOME/.pnpm-store"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pw-${{ runner.os }}-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision pinned Chromium and Linux dependencies
        run: pnpm --dir apps/visual-regression exec playwright install ${{ steps.pw-cache.outputs.cache-hit == 'true' && '' || '--with-deps' }} chromium

      - name: Run the Web accessibility audit gate (axe-core + Playwright)
        run: pnpm --dir apps/visual-regression test:a11y

      # Uploaded on every run (not just failure): the JSON/HTML detail is the
      # actionable artifact issue #145 requires, and a passing run's report
      # still records per-scenario allowlisted/non-blocking findings for
      # review.
      - name: Upload accessibility audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-a11y-report-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            apps/visual-regression/a11y-report
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-a11y-playwright-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            apps/visual-regression/test-results
            apps/visual-regression/playwright-report
          if-no-files-found: warn
          retention-days: 3
